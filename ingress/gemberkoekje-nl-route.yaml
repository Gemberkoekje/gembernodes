# gemberkoekje.nl itself: port 80 redirects to HTTPS for every path. The apps' own paths on the apex
# (/adventureengine, /dnd, /plotboek...) are HTTPRoutes in their own files, on the Gateway's
# https-gemberkoekje-nl listener; nothing serves "/" (404).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gemberkoekje-nl-redirect
  namespace: traefik
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: http
  hostnames:
    - gemberkoekje.nl
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
