apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plotboek-generator-ingress
  namespace: plotboek-generator
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # The OIDC sign-in sets large chunked cookies on /signin-oidc-google; nginx's default proxy
    # buffer is too small for those headers and answers 502 ("upstream sent too big header").
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  ingressClassName: nginx-public
  tls:
  - hosts:
    - plotboek.gemberkoekje.nl
    secretName: plotboek-generator-tls
  rules:
  - host: plotboek.gemberkoekje.nl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: plotboek-generator-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plotboek-generator-redirect
  namespace: plotboek-generator
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # gemberkoekje.nl/plotboek is the short link to the demo. nginx answers the redirect itself and
    # appends whatever follows the prefix, so /plotboek/Privacy lands on /Privacy. No trailing slash
    # on the target, or that would become //Privacy (see vortexplotboek-ingress.yaml).
    nginx.ingress.kubernetes.io/permanent-redirect: "https://plotboek.gemberkoekje.nl"
spec:
  ingressClassName: nginx-public
  tls:
  - hosts:
    - gemberkoekje.nl
    secretName: plotboek-generator-redirect-tls
  rules:
  - host: gemberkoekje.nl
    http:
      paths:
      - path: /plotboek
        pathType: Prefix
        backend:
          service:
            name: plotboek-generator-service
            port:
              number: 80
