# kluskat.gemberkoekje.nl through the Gateway API: the model for every new public route (CLAUDE.md).
# It needs an https-kluskat listener on the public Gateway (infrastructure/traefik/gateway.yaml),
# where cert-manager issues the certificate.
#
# Port 80: redirect to HTTPS, with 308 so a POST stays a POST. cert-manager's ACME challenge routes
# on the same listener match an exact path, so they take precedence over this catch-all. No port in
# the filter: Traefik then leaves it out of the Location header, while an explicit 443 shows up
# there as ":443".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kluskat-redirect
  namespace: kluskat
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: http
  hostnames:
    - kluskat.gemberkoekje.nl
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
---
# Port 443: the app. TLS ends at the Gateway; HSTS comes from Traefik's websecure entrypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kluskat
  namespace: kluskat
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https-kluskat
  hostnames:
    - kluskat.gemberkoekje.nl
  rules:
    - backendRefs:
        - name: kluskat-service
          port: 80
