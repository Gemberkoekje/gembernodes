# The SpaceTraders dashboard and its internal API, on the LAN only (SpaceTraders PLAN.md D11, B22):
# the dashboard hands the internal API key to every browser that opens it, so it must not be
# reachable from the internet. Like Grafana's /grafana
# (infrastructure/monitoring/grafana-internal-route.yaml): no hostname, plain HTTP, and only LAN and
# cluster addresses. On the LAN:
#   http://192.168.1.231/spacetraders/dashboard/
#
# A route without a hostname applies to any host on port 80, and Traefik ranks the longer path above
# a hostname match, so these paths win on every hostname's port 80. The allowlist keeps them LAN-only.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: spacetraders
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/16
      - 10.0.0.0/8
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spacetraders-internal
  namespace: spacetraders
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /spacetraders/api
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: lan-only
      backendRefs:
        - name: spacetraders-api-service
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /spacetraders/dashboard
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: lan-only
      backendRefs:
        - name: spacetraders-webui-service
          port: 80
