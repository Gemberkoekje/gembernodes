# gemberkoekje.nl itself: the front page (Gemberkoekje/projects FrontPage), on the shared
# https-gemberkoekje-nl listener. PathPrefix "/" catches every path no other route claims: the apps
# that answer on a path of the bare domain (/adventureengine, /dnd, /plotboek...) keep theirs,
# because the longest matching path wins. Port 80 redirects to HTTPS in gemberkoekje-nl-route.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontpage
  namespace: frontpage
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https-gemberkoekje-nl
  hostnames:
    - gemberkoekje.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontpage-service
          port: 80
