# kris.gemberkoekje.nl through the public Gateway (infrastructure/traefik/gateway.yaml), set up like
# every public route (CLAUDE.md, "Public routes"): the design mock of Kristoffer Zegers' photography
# site. Also on gemberkoekje.nl/kris.
#
# Port 80: redirect to HTTPS (308, so a POST stays a POST). cert-manager's ACME challenge routes on
# the same listener match an exact path, so they take precedence over this catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kris-redirect
  namespace: kris
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: http
  hostnames:
    - kris.gemberkoekje.nl
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
---
# Port 443: the page. TLS ends at the Gateway; HSTS comes from Traefik's websecure entrypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kris
  namespace: kris
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https-kris
  hostnames:
    - kris.gemberkoekje.nl
  rules:
    - backendRefs:
        - name: kris
          port: 80
---
# gemberkoekje.nl/kris, on the shared https-gemberkoekje-nl listener.
# The pod gets the path as is; its Caddyfile strips the prefix.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kris-apex
  namespace: kris
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https-gemberkoekje-nl
  hostnames:
    - gemberkoekje.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /kris
      backendRefs:
        - name: kris
          port: 80
