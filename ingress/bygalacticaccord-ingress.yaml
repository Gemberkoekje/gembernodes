apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bygalacticaccord-ingress
  namespace: bygalacticaccord
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx-public
  tls:
  - hosts:
    - bygalacticaccord.gemberkoekje.nl
    secretName: bygalacticaccord-tls
  rules:
  - host: bygalacticaccord.gemberkoekje.nl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bygalacticaccord-service
            port:
              number: 80
