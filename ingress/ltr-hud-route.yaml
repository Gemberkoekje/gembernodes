# ltr-hud.gemberkoekje.nl through the public Gateway (infrastructure/traefik/gateway.yaml),
# set up like every public route (CLAUDE.md, "Public routes"): the Limit Theory Redux HUD mocks.
# Also on gemberkoekje.nl/ltr-hud.
#
# Port 80: redirect to HTTPS (308, so a POST stays a POST). cert-manager's ACME challenge routes on
# the same listener match an exact path, so they take precedence over this catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ltr-hud-redirect
  namespace: ltr-hud
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: http
  hostnames:
    - ltr-hud.gemberkoekje.nl
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
---
# Port 443: the pages. TLS ends at the Gateway; HSTS comes from Traefik's websecure entrypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ltr-hud
  namespace: ltr-hud
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https-ltr-hud
  hostnames:
    - ltr-hud.gemberkoekje.nl
  rules:
    - backendRefs:
        - name: ltr-hud-service
          port: 80
---
# gemberkoekje.nl/ltr-hud, on the shared https-gemberkoekje-nl listener.
# The pod gets the path as is; its Caddyfile strips the prefix.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ltr-hud-apex
  namespace: ltr-hud
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https-gemberkoekje-nl
  hostnames:
    - gemberkoekje.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ltr-hud
      backendRefs:
        - name: ltr-hud-service
          port: 80
