# samenspelers.gemberkoekje.nl through the public Gateway (infrastructure/traefik/gateway.yaml),
# set up like every public route (CLAUDE.md, "Public routes"): the Klaverjas app, under the club's
# name (De Samenspelers). Its first address, klaverjas.gemberkoekje.nl, and the short link
# gemberkoekje.nl/klaverjas redirect to it, keeping the path: the slips handed out with the old
# address keep working, and /beheer stays /beheer.
#
# Port 80: one step to HTTPS on the new name (308, so a POST stays a POST). cert-manager's ACME
# challenge routes on the same listener match an exact path, so they take precedence over this
# catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: klaverjas-redirect
  namespace: klaverjas
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: http
  hostnames:
    - samenspelers.gemberkoekje.nl
    - klaverjas.gemberkoekje.nl
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: samenspelers.gemberkoekje.nl
            statusCode: 308
---
# Port 443: the app. TLS ends at the Gateway; HSTS comes from Traefik's websecure entrypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: klaverjas
  namespace: klaverjas
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https-samenspelers
  hostnames:
    - samenspelers.gemberkoekje.nl
  rules:
    - backendRefs:
        - name: klaverjas
          port: 80
---
# https://klaverjas.gemberkoekje.nl: the old name, on its own listener (it keeps its certificate),
# redirects to the new one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: klaverjas-oude-naam
  namespace: klaverjas
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https-klaverjas
  hostnames:
    - klaverjas.gemberkoekje.nl
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: samenspelers.gemberkoekje.nl
            statusCode: 308
---
# gemberkoekje.nl/klaverjas: the short link (it once showed the mock). It redirects to the new name
# and keeps whatever follows the prefix, so /klaverjas/beheer lands on /beheer. On port 80 as well,
# so it goes there in one step.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: klaverjas-apex
  namespace: klaverjas
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: http
    - name: public
      namespace: traefik
      sectionName: https-gemberkoekje-nl
  hostnames:
    - gemberkoekje.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /klaverjas
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: samenspelers.gemberkoekje.nl
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
            statusCode: 301
