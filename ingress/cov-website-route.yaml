# cov-website.gemberkoekje.nl through the public Gateway (infrastructure/traefik/gateway.yaml),
# set up like every public route (CLAUDE.md, "Public routes").
# Also on gemberkoekje.nl/cov-website.
#
# Port 80: redirect to HTTPS (308, so a POST stays a POST). cert-manager's ACME challenge routes on
# the same listener match an exact path, so they take precedence over this catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cov-website-redirect
  namespace: cov-website
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: http
  hostnames:
    - cov-website.gemberkoekje.nl
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
---
# Port 443: the app. TLS ends at the Gateway; HSTS comes from Traefik's websecure entrypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cov-website
  namespace: cov-website
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https-cov-website
  hostnames:
    - cov-website.gemberkoekje.nl
  rules:
    - backendRefs:
        - name: cov-website-service
          port: 80
---
# gemberkoekje.nl/cov-website, on the shared https-gemberkoekje-nl listener.
# The app gets the path as is.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cov-website-apex
  namespace: cov-website
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: https-gemberkoekje-nl
  hostnames:
    - gemberkoekje.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /cov-website
      backendRefs:
        - name: cov-website-service
          port: 80
