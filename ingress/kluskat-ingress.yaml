apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kluskat-ingress
  namespace: kluskat
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx-public
  tls:
  - hosts:
    - kluskat.gemberkoekje.nl
    secretName: kluskat-tls
  rules:
  - host: kluskat.gemberkoekje.nl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kluskat-service
            port:
              number: 80
