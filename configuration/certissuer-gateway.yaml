# Let's Encrypt for the listeners of the public Gateway (infrastructure/traefik/gateway.yaml),
# whose cert-manager.io/cluster-issuer annotation names this issuer. HTTP-01 challenges are
# answered with a temporary HTTPRoute on the Gateway's http listener. letsencrypt-prod
# (certissuer.yaml) stays for the remaining Ingress objects and goes when the last one moves.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-gateway
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: Arie_Hofland@hotmail.com
    privateKeySecretRef:
      name: letsencrypt-gateway
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: public
                namespace: traefik
                sectionName: http
