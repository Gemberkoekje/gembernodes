# The flux-system Namespace also comes from clusters/home/flux-system/gotk-components.yaml. Two
# Kustomizations applying it made them overwrite each other's owner labels every ~10 minutes, and
# the "namespaces" Kustomization's brief not-ready state stalled everything that depends on it.
# Step 1 of handing it to the flux-system Kustomization alone: never prune it (the same annotation
# is patched onto the gotk copy), so step 2 can drop this file without the "namespaces"
# Kustomization deleting the Namespace Flux runs in.
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
