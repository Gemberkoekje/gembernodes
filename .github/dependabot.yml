# Dependabot: weekly pull requests for newer versions, which CI checks like any other change
# (scripts/validate.py; scripts/check_images.py for the images). A merged one deploys through Flux at
# once, so read the release notes first: the Servarr apps migrate their databases on start
# (apps/zeef/README.md).
#
# Not covered here:
# - The Helm charts. Dependabot can't read Flux HelmReleases; their "x" version ranges let Flux take
#   new chart versions within the range by itself.
# - The k3s upgrade Plans: their image has no tag, and k3s comes from the stable channel.
# - Bitnami PostgreSQL: pinned by digest in the HelmRelease values (postgresql-release.yaml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Image tags in the manifests of every app and infrastructure folder (archive/ is left out). One
  # pull request per image, covering every folder that uses it (busybox, postgres, curl...).
  - package-ecosystem: docker
    directories:
      - /apps/*
      - /infrastructure/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      per-image:
        group-by: dependency-name
        patterns: ["*"]
    # Dependabot names images without their registry host: "gemberkoekje/kluskat" for
    # ghcr.io/gemberkoekje/kluskat, "linuxserver/sonarr" for lscr.io/linuxserver/sonarr. Patterns
    # with the host match nothing.
    ignore:
      # Built and deployed by each app's own repository: their tags are commit SHAs or build numbers.
      - dependency-name: "gemberkoekje/*"
      - dependency-name: "eosfrontier/*"
      # The linuxserver images: Sonarr, Radarr, Prowlarr, Bazarr, qBittorrent. Dependabot misreads
      # their tags: it offered linuxserver's old "v4-4.0.0.124-ls2", an older Sonarr, as an update
      # (#178). The Servarr apps also migrate their databases on start, and qBittorrent stays at
      # 5.2.4 until MyAnonamouse allows 5.3. Bump these by hand after reading the release notes.
      - dependency-name: "linuxserver/*"
      # Patch releases only for the backup jobs' Python: a new minor version first appears as
      # alpha tags (it offered 3.16.0a1, #179).
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
