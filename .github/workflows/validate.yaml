# Checks the repository the way Flux will read it, before it reaches main: see scripts/validate.py.
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KUBECONFORM_VERSION: v0.8.0
      # What helm-controller renders with in Flux v2.5.1 (helm-controller v1.2.0). Bump with Flux.
      HELM_VERSION: v3.17.1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          set -euo pipefail
          # The flux CLI of the Flux version installed in the cluster, so builds match kustomize-controller.
          flux_version=$(sed -n 's/^# Flux Version: v//p' clusters/home/flux-system/gotk-components.yaml)
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/fluxcd/flux2/releases/download/v${flux_version}/flux_${flux_version}_linux_amd64.tar.gz" \
            | tar xz -C "$HOME/bin" flux
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/bin" kubeconform
          curl -sSfL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/bin" --strip-components=1 linux-amd64/helm
          echo "$HOME/bin" >> "$GITHUB_PATH"
          pip install pyyaml==6.0.2

      - name: Validate
        run: python scripts/validate.py

  images:
    # The images a pull request adds or changes have to exist before it merges (scripts/check_images.py):
    # a deploy PR opened while its image still builds waits for it, up to 20 minutes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Tried for a private package on ghcr.io: reads only the packages that give this repository access.
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Images exist
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: python3 scripts/check_images.py "origin/${{ github.base_ref }}"
