# Checks the repository the way Flux will read it, before it reaches main: see scripts/validate.py.
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KUBECONFORM_VERSION: v0.8.0
      # What helm-controller renders with in Flux v2.5.1 (helm-controller v1.2.0). Bump with Flux.
      HELM_VERSION: v3.17.1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # pyyaml's wheel, pinned below, comes from pip's cache once seen.
          cache: pip
          cache-dependency-path: .github/workflows/validate.yaml

      # The flux CLI of the Flux version installed in the cluster, so builds match kustomize-controller.
      - name: Tool versions
        id: versions
        run: |
          echo "flux=$(sed -n 's/^# Flux Version: v//p' clusters/home/flux-system/gotk-components.yaml)" >> "$GITHUB_OUTPUT"

      # The same tool versions on every run: downloaded once per version, not on every run, so a GitHub releases
      # outage (504s for an hour on 2026-11-08) doesn't fail validation while the versions stay the same.
      - name: Cache tools
        id: tools
        uses: actions/cache@v6
        with:
          path: ~/bin
          key: tools-flux-${{ steps.versions.outputs.flux }}-kubeconform-${{ env.KUBECONFORM_VERSION }}-helm-${{ env.HELM_VERSION }}

      - name: Install tools
        if: steps.tools.outputs.cache-hit != 'true'
        env:
          FLUX_VERSION: ${{ steps.versions.outputs.flux }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -sSfL --retry 3 "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "$HOME/bin" flux
          curl -sSfL --retry 3 "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/bin" kubeconform
          curl -sSfL --retry 3 "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/bin" --strip-components=1 linux-amd64/helm

      - name: Python packages
        run: |
          echo "$HOME/bin" >> "$GITHUB_PATH"
          pip install pyyaml==6.0.2

      - name: Validate
        run: python scripts/validate.py

  images:
    # The images a pull request adds or changes have to exist before it merges (scripts/check_images.py):
    # a deploy PR opened while its image still builds waits for it, up to 20 minutes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Tried for a private package on ghcr.io: reads only the packages that give this repository access.
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Images exist
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: python3 scripts/check_images.py "origin/${{ github.base_ref }}"
