# OCIRepository is only served as v1 from Flux 2.6 on; keep v1beta2 until Flux is upgraded.
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: postgresql-chart
  namespace: flux-system
spec:
  interval: 1m0s
  url: oci://registry-1.docker.io/bitnamicharts/postgresql
  ref:
    tag: 18.5.14