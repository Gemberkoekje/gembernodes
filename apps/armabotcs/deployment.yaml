apiVersion: apps/v1
kind: Deployment
metadata:
  name: armabotcs
  namespace: armabotcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: armabotcs
  template:
    metadata:
      labels:
        app: armabotcs
    spec:
      imagePullSecrets:
        - name: ghcr-login
      # The bot exits with an unhandled exception when PostgreSQL is unreachable at startup,
      # which after a node reboot meant a crash loop until the database was back. Wait for it.
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgresql.flux-system.svc.cluster.local -p 5432 -t 2; do echo "waiting for postgres"; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      containers:
        - name: armabotcs
          image: ghcr.io/gemberkoekje/armabotcs:1.0.0-58
          command: ["dotnet", "ArmaBotCs.dll"] # <-- Add this line (replace with your actual entrypoint)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Note: no HTTP probes since this is a Discord bot with no HTTP server.
          # Kubernetes will restart the pod if the dotnet process exits.
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: postgress-secret
                  key: connectionstring
            - name: Discord__Token
              valueFrom:
                secretKeyRef:
                  name: discord-secret
                  key: token
