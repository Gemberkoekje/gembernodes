apiVersion: apps/v1
kind: Deployment
metadata:
  name: dungeontable
  namespace: dungeontable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dungeontable
  template:
    metadata:
      labels:
        app: dungeontable
    spec:
      imagePullSecrets:
        - name: ghcr-login
      containers:
        - name: dungeontable
          image: ghcr.io/gemberkoekje/dungeontable:1.8.0-c89
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 18
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            # Two cores, not 500m: one change on the DM screen re-renders the DM screen and the
            # projector, and on a large level that took up to half a second of CPU, more than the
            # 50 ms a 500m limit allows per 100 ms period, so the pod was throttled in bursts while
            # the table waited (NOTES.md, 2026-11-05).
            limits:
              memory: "1Gi"
              cpu: "2"
          env:
            - name: DOTNET_ENVIRONMENT
              value: "Production"
            # Maps/ is baked into the image and read-only here: the *.regions.json the Room Editor
            # writes are authored content, committed to the repo so a newly authored level reaches
            # every environment. Telling the app so makes /editor say a save is not durable instead
            # of reporting success and losing the work on the next restart.
            - name: Maps__Durable
              value: "false"
            - name: Auth__Passphrase
              valueFrom:
                secretKeyRef:
                  name: dungeontable-secrets
                  key: Auth__Passphrase
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: dungeontable-secrets
                  key: ConnectionStrings__Postgres
          volumeMounts:
            # The pictures the DM uploads on the Art tab (data/art/uploads/). ONLY this
            # subdirectory is mounted: everything else under /app/data - the dossiers, stat
            # blocks and curated book art - is baked into the image, and mounting /app/data
            # would shadow all of it.
            - name: uploads
              mountPath: /app/data/art/uploads
            # ASP.NET Core Data Protection keys (auth cookies, antiforgery). Without a volume they
            # were regenerated on every restart, which logged everyone out.
            - name: dataprotection-keys
              mountPath: /root/.aspnet/DataProtection-Keys
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: dungeontable-uploads-qnap
        - name: dataprotection-keys
          persistentVolumeClaim:
            claimName: dungeontable-dataprotection-qnap
