# print-manager TEST desk: CUPS + print-manager (container `desk`) and two fake HP LaserJet 4250s
# (scripts/fake-jetdirect.py) in the same pod, so CUPS reaches them on 127.0.0.2:9100 (Printer A)
# and 127.0.0.1:9100 (Printer B) as it would reach the real ones on the printer LAN. The image is
# released from Gemberkoekje/print-manager, the private GitHub copy of
# vortexadventures/print-manager (Dockerfile, deploy/README.md there).
#
# This desk marks cards and packs printed in void, which takes them off that void's queue. It must
# only ever talk to the test void: PRINT_MANAGER_VOID_HOST_LOCK below makes print-manager refuse
# any other host (requests, redirects, Admin saves, start-up), and the image will not start without
# it. Keep both the lock and VOID_BASE_URL here in the pod spec, never in config.yaml on the volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: print-manager-test
  namespace: print-manager-test
spec:
  # Exactly one desk: two would both download and print the same void cards.
  replicas: 1
  # The old desk must be gone before the new one polls void (a rolling update overlaps them), and
  # the ReadWriteOnce volume can only be on one pod anyway.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: print-manager-test
  template:
    metadata:
      labels:
        app: print-manager-test
    spec:
      imagePullSecrets:
        - name: ghcr-login
      # Service links would put PRINT_MANAGER_TEST_* variables next to print-manager's own
      # PRINT_MANAGER_* settings; it reads none of those names, but keep its environment clean.
      enableServiceLinks: false
      containers:
        - name: desk
          # A release of Gemberkoekje/print-manager: git tag v0.1.0 is image tag 0.1.0.
          image: ghcr.io/gemberkoekje/print-manager:0.3.1
          imagePullPolicy: IfNotPresent
          # Runs as root: cupsd needs it (it drops to lp for filters), the pmspool backend runs as
          # root, and print-manager calls lpadmin. No privileged mode or extra capabilities.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 80
            - name: ipp
              containerPort: 631
          env:
            - name: PRINT_MANAGER_VOID_HOST_LOCK
              value: "test-void-api.the-vortex.nl"
            - name: VOID_BASE_URL
              value: "https://test-void-api.the-vortex.nl/"
            - name: VOID_PLIN
              valueFrom:
                secretKeyRef:
                  name: print-manager-test-secrets
                  key: VOID_PLIN
            - name: VOID_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: print-manager-test-secrets
                  key: VOID_PASSWORD
          # /health is 200 while the service loop heartbeats and 503 once the heartbeat is older
          # than 30 s. A paused desk (after a print failure) still heartbeats. If cupsd dies, the
          # entrypoint stops print-manager and the container exits.
          startupProbe:
            httpGet:
              path: /health
              port: 80
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            # Ghostscript renders cards and LAN jobs to PCL on up to 8 workers.
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /data
        # Fake printers. Their web pages are on the LAN through the Service: :8100 is Printer B
        # (Special tray, cards) and :8101 is Printer A (White). Port 9100 and SNMP stay on loopback
        # inside the pod, so only CUPS can reach those, as on the printer LAN.
        # Root only for SNMP on udp/161, which is how CUPS sees jams, empty trays and offline.
        - name: printer-b
          image: ghcr.io/gemberkoekje/print-manager:0.3.1
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/print-manager/scripts/fake-jetdirect.py",
                    "--bind", "127.0.0.1", "--control-bind", "0.0.0.0", "--control-port", "8100",
                    "--out", "/data/fake-printer-b"]
          ports:
            - name: printer-b-web
              containerPort: 8100
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /data
        - name: printer-a
          image: ghcr.io/gemberkoekje/print-manager:0.3.1
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/print-manager/scripts/fake-jetdirect.py",
                    "--bind", "127.0.0.2", "--control-bind", "0.0.0.0", "--control-port", "8101",
                    "--out", "/data/fake-printer-a"]
          ports:
            - name: printer-a-web
              containerPort: 8101
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: print-manager-test-data-qnap
