# The Klaverjas app: the weekly scoring of a klaverjas club, run by a 70-year-old. At / the players
# see the standings behind the club's password; Dad keeps the scores at /beheer with his own. It
# can mail the standings with a PDF (optional). Source: Gemberkoekje/projects `Klaverjas/`
# (image `ghcr.io/gemberkoekje/klaverjas:<commit sha>`, built by "Build and Push Klaverjas" on
# main). Before the first deploy: README.md (database and 1Password item).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klaverjas
  namespace: klaverjas
  labels:
    app: klaverjas
spec:
  replicas: 1
  # One pod on purpose: Marten's first-start schema creation assumes a single writer, and a club of
  # twenty needs no second replica. With one replica, maxSurge 0 stops the old pod before the new
  # one starts, as Recreate would. (This Deployment existed as the mock with RollingUpdate; switching
  # an existing Deployment to Recreate fails under server-side apply on the kept rollingUpdate
  # defaults, NOTES.md 2026-11-24.)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: klaverjas
  template:
    metadata:
      labels:
        app: klaverjas
    spec:
      imagePullSecrets:
        - name: ghcr-login
      containers:
        - name: klaverjas
          # A sha "Build and Push Klaverjas" has pushed from projects main (README, Deploying).
          image: ghcr.io/gemberkoekje/klaverjas:32684dcf571c18f4eacff92b9cc0523dd44aaed6
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: klaverjas-secrets
                  key: ConnectionStrings__Postgres
            # Dad's first password for /beheer. Once he chooses his own in Instellingen, this one
            # stays the site keeper's way back in.
            - name: Auth__Password
              valueFrom:
                secretKeyRef:
                  name: klaverjas-secrets
                  key: Auth__Password
            # Optional: mailing the standings. The host (smtp.gmail.com:587, STARTTLS) is the
            # app's default; without the account and its app password mailing stays off, and the
            # screens say so. The sender address is the account itself.
            - name: Mail__User
              valueFrom:
                secretKeyRef:
                  name: klaverjas-secrets
                  key: Mail__User
                  optional: true
            - name: Mail__Password
              valueFrom:
                secretKeyRef:
                  name: mail-secret
                  key: SMTP_PASSWORD
                  optional: true
          # /healthz is anonymous and touches nothing. The first start also creates the Marten
          # schema, hence the generous startup window.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # Reading Dad's Excel workbook (ClosedXML) and making the PDF (QuestPDF) take more memory
          # than a plain page; the limit leaves room for both.
          resources:
            requests:
              cpu: 25m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 512Mi
