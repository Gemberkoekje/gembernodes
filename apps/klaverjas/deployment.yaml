# A design mock of the Klaverjas app: the weekly scoring and standings mail for a klaverjas
# competition, run by a 70-year-old. One self-contained, clickable HTML page with invented member
# names, served by Caddy. Set up like geneaducatie. Version 2 follows the workbooks the club uses
# today: the evening preparation (draw, table plan, score cards) and slapers.
#
# The page is in Git: index.html in this folder, about 80 KB, well under a ConfigMap's 1 MiB.
# kustomization.yaml turns it and the Caddyfile into the ConfigMap klaverjas-site, whose name gets
# a hash of its content, so a changed page rolls the pod by itself. Its source is
# Klaverjas/mock/ in Gemberkoekje/projects. The real app will take over this hostname later.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klaverjas
  namespace: klaverjas
  labels:
    app: klaverjas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klaverjas
  template:
    metadata:
      labels:
        app: klaverjas
    spec:
      containers:
        - name: caddy
          image: caddy:2.11.9-alpine
          command:
            - caddy
          args:
            - run
            - --config
            - /etc/caddy/Caddyfile
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: "10m"
              memory: "24Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: site
              mountPath: /srv
              readOnly: true
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
      # Both from the one ConfigMap, each mounted on its own, so the Caddyfile isn't served as a page.
      volumes:
        - name: site
          configMap:
            name: klaverjas-site
            items:
              - key: index.html
                path: index.html
        - name: caddy-config
          configMap:
            name: klaverjas-site
            items:
              - key: Caddyfile
                path: Caddyfile
