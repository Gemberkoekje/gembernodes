# The shared mail account's app password (field SMTP_PASSWORD), the same 1Password item cov-website
# and Grafana use. Klaverjas mails the standings with it (optional extra; README.md).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: mail-secret
  namespace: klaverjas
spec:
  itemPath: "vaults/Gembercluster/items/mail-secret"
