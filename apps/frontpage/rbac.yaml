# The front page shows a live summary of the cluster (Gemberkoekje/projects FrontPage/DESIGN.md).
# It reads, as this ServiceAccount, only what that summary needs: nodes, pods, Deployments,
# StatefulSets and node metrics, and the flux-system GitRepository for the running commit.
#
# get/list only. Never bind edit or admin here: Flux's flux-edit ClusterRole aggregates into both,
# so either would let this account create a Kustomization that reconciles as cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontpage
  namespace: frontpage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frontpage-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    resourceNames: ["flux-system"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frontpage-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frontpage-cluster-reader
subjects:
  - kind: ServiceAccount
    name: frontpage
    namespace: frontpage
