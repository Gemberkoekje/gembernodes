# Inside the cluster only. The pod uses the node's network, so the Service's endpoint is
# 192.168.1.201:8123. The way in from the LAN and the tailnet is
# https://homeassistant.lan.gemberkoekje.nl (Caddy, infrastructure/lan-proxy); other cluster apps
# use http://homeassistant.home-automation.svc.cluster.local:8123 (REST and WebSocket API).
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: home-automation
spec:
  type: ClusterIP
  selector:
    app: homeassistant
  ports:
    - name: http
      port: 8123
      targetPort: http
