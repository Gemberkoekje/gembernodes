apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home-automation

resources:
  - homeassistant-secrets.yaml
  - homeassistant-monitoring-secrets.yaml
  - deployment.yaml
  - service.yaml

# Content-hashed names, so a change to any of these files restarts Home Assistant.
configMapGenerator:
  - name: homeassistant-configuration
    files:
      - configuration.yaml
  - name: homeassistant-scripts
    files:
      - prepare-config.py
  # Our own Tuya Local device definitions: prepare-config.py copies them into Tuya Local.
  - name: homeassistant-tuya-local-devices
    files:
      - tuya-local/joula_diamond_dishwasher.yaml
