# Tuya Local device definition for the Joula "Diamond" mini dishwasher (sold by Onebird B.V.).
# Not in Tuya Local itself: mapped on 2026-11-15 from the device's own values (debug log of a
# Fruit run, every program button, a forced stop and the child lock; NOTES.md has the details).
# prepare-config.py copies it into custom_components/tuya_local/devices on every start, because
# a Tuya Local update replaces that folder. The file name must not clash with one of Tuya Local's.

name: Dishwasher
products:
  - id: ge7uqcphecrspln7
    manufacturer: Joula
    model: Diamond
entities:
  - entity: switch
    icon: "mdi:dishwasher"
    dps:
      - id: 1
        type: boolean
        name: switch
  - entity: button
    name: Start
    icon: "mdi:play"
    dps:
      - id: 2
        type: boolean
        name: button
  - entity: button
    name: Pause
    icon: "mdi:pause"
    dps:
      - id: 2
        type: boolean
        name: button
        mapping:
          - dps_val: true
            value: false
          - dps_val: false
            value: true
  - entity: binary_sensor
    class: running
    category: diagnostic
    dps:
      - id: 2
        type: boolean
        name: sensor
  - entity: select
    translation_key: washing_mode
    category: config
    dps:
      - id: 6
        type: string
        name: option
        mapping:
          - dps_val: biaozhunxi69
            value: standard
          - dps_val: jienengxi68
            value: eco
          - dps_val: kuaishuxi29
            value: rapid
          - dps_val: qianglixi89
            value: intensive
          - dps_val: bolixi50
            value: glass
          - dps_val: guoshuxi19
            value: fruit
          - dps_val: zhiqingjie79
            value: self_clean
  # Only standby, cleaning, paishui and done have been seen so far (a Fruit run and a forced
  # stop). A program with drying, or a delayed start, may report others: those show as
  # "other", with the device's own value in the raw_value attribute.
  - entity: sensor
    translation_key: status
    class: enum
    category: diagnostic
    dps:
      - id: 7
        type: string
        name: sensor
        mapping:
          - dps_val: standby
            value: standby
          - dps_val: cleaning
            value: washing
          - dps_val: paishui
            value: draining
          - dps_val: done
            value: done
          - value: other
      - id: 7
        type: string
        name: raw_value
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 9
        type: integer
        name: sensor
        unit: min
  - entity: sensor
    name: Stage
    icon: "mdi:progress-clock"
    class: enum
    category: diagnostic
    dps:
      - id: 10
        type: string
        name: sensor
        mapping:
          - dps_val: yuxi
            value: pre-wash
          - dps_val: zhuxi
            value: main wash
          - dps_val: piaoxi
            value: rinse
          - value: other
      - id: 10
        type: string
        name: raw_value
  - entity: sensor
    class: temperature
    category: diagnostic
    dps:
      - id: 11
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 18
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 18
        type: bitfield
        name: fault_code
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 19
        type: boolean
        name: lock
