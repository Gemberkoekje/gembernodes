# The item Home Assistant shares with the monitoring namespace (Prometheus scrapes Home Assistant;
# Grafana posts its alerts to it). Fields used (exact labels): GRAFANA_WEBHOOK_ID, here. Its other
# field, HOMEASSISTANT_TOKEN, is Home Assistant's own token, for Prometheus. The same item is in
# infrastructure/monitoring/homeassistant-monitoring-secrets.yaml. See README.md, "Monitoring".
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: homeassistant-monitoring
  namespace: home-automation
spec:
  itemPath: "vaults/Gembercluster/items/homeassistant-monitoring"
