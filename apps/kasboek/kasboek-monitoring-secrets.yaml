# The item Kasboek shares with the monitoring namespace: the token Prometheus sends to Kasboek's
# /metrics (the burndown behind Grafana's Kasboek alert). Field used (exact label):
# KASBOEK_METRICS_TOKEN, here as Metrics__Token (deployment.yaml, optional). The same item is in
# infrastructure/monitoring/kasboek-monitoring-secrets.yaml. A separate item, so the monitoring
# namespace never gets a copy of kasboek-secrets (the database password, the bank key). See README.md,
# "Monitoring".
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: kasboek-monitoring
  namespace: kasboek
spec:
  itemPath: "vaults/Gembercluster/items/kasboek-monitoring"
