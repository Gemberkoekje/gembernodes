# Cleanuparr: checks the file list of every Sonarr, Radarr and Chaptarr torrent as soon as its
# metadata arrives (Malware Blocker) and removes stalled or unimportable downloads (Queue Cleaner).
# Bad releases are blocklisted in the app that grabbed them, which then searches for another one.
# It works through the qBittorrent, Sonarr, Radarr and Chaptarr APIs only (Chaptarr needs 2.11.0
# or later), so it doesn't mount the media share. Its database is in the shared
# PostgreSQL (database cleanuparr); /config keeps its DataProtection keys and logs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanuparr
  namespace: zeef
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cleanuparr
  template:
    metadata:
      labels:
        app: cleanuparr
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgresql.flux-system.svc.cluster.local -p 5432 -t 2; do echo "waiting for postgres"; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: cleanuparr
          image: ghcr.io/cleanuparr/cleanuparr:2.11.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: PORT
              value: "11011"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "022"
            - name: TZ
              value: Europe/Amsterdam
            - name: DATABASE_PROVIDER
              value: postgres
            - name: POSTGRES_HOST
              value: postgresql.flux-system.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: cleanuparr
            - name: POSTGRES_DB
              value: cleanuparr
            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: zeef-stack
                  key: CLEANUPARR__POSTGRES__PASSWORD
          ports:
            - name: http
              containerPort: 11011
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            # Malware Blocker → Chaptarr → path /blocklists/audiobooks.txt (see the ConfigMap below).
            - name: blocklists
              mountPath: /blocklists
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: cleanuparr-config
        - name: blocklists
          configMap:
            name: cleanuparr-blocklists
---
# Malware Blocker list for Chaptarr, type Whitelist: a file that matches no line is skipped (not
# downloaded), and a release whose files all fail is removed and blocklisted in Chaptarr, which then
# searches again. Sonarr/Radarr's shared blacklist (cleanuparr.pages.dev) can't be used for
# audiobooks: it blocks *.mp3, *.m4a, *.flac, *.jpg and *.cue, so it would throw away most
# audiobook releases. Patterns match the end of the file name, ignoring case. Cleanuparr re-reads a
# local list at least every 5 minutes, and the kubelet updates the mounted file within a minute or
# two of a change here, so no restart is needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cleanuparr-blocklists
  namespace: zeef
data:
  audiobooks.txt: |
    *.mp3
    *.m4b
    *.m4a
    *.mp4
    *.aac
    *.flac
    *.ogg
    *.oga
    *.opus
    *.wma
    *.wav
    *.mka
    *.jpg
    *.jpeg
    *.png
    *.webp
    *.cue
    *.nfo
    *.txt
    *.opf
    *.m3u
    *.m3u8
    *.sfv
    *.md5
    *.pdf
    *.epub
---
# LAN and tailnet only, on the shared 192.168.1.234 (the router forwards nothing to it).
apiVersion: v1
kind: Service
metadata:
  name: cleanuparr
  namespace: zeef
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.234
    metallb.io/allow-shared-ip: zeef-lan
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: cleanuparr
  ports:
    - name: http
      port: 11011
      targetPort: http
