# Chaptarr: Sonarr's counterpart for audiobooks (a Readarr fork; Readarr itself is retired).
# AudioBookRequest hands it each request by ASIN. Chaptarr searches the indexers that Prowlarr syncs
# into it (as a "Readarr" app), grabs through qBittorrent (category "chaptarr"), and hardlinks
# finished books into /data/Audiobooks with Author/Title folders. Then it tells Audiobookshelf.
# Because the downloads go through Chaptarr's queue, Cleanuparr (2.11.0 and later) checks them like
# Sonarr's: Malware Blocker and Queue Cleaner.
# Its databases are SQLite in /config (chaptarr.db, logs.db, cache.db, staging.db, WAL mode), on
# local-path, not NFS: SQLite on NFS corrupts. Not the shared PostgreSQL: that runs in FIPS mode,
# where md5() fails, and one of Chaptarr's PostgreSQL migrations uses md5() (NOTES.md, 2026-11-09).
# Setup after the first deploy: Gemberkoekje/projects Zeef/DEPLOY.md, part D.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaptarr
  namespace: zeef
spec:
  replicas: 1
  # One writer for the SQLite databases; the local-path volume can only be on one node anyway.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chaptarr
  template:
    metadata:
      labels:
        app: chaptarr
    spec:
      # No fsGroup: the kubelet would chown every file on /data, which is the media library.
      # The image starts as root, sets the owner of /config and drops to PUID/PGID itself (gosu).
      enableServiceLinks: false
      containers:
        - name: chaptarr
          image: chaptarr/chaptarr:0.9.965
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "002"
            - name: TZ
              value: Europe/Amsterdam
            # The API key comes from 1Password, so Prowlarr, AudioBookRequest and Cleanuparr use the
            # same value without anyone copying it out of a UI.
            - name: CHAPTARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: zeef-stack
                  key: CHAPTARR__AUTH__APIKEY
            # Login always required, method deliberately not set: as with the Servarr apps, the
            # first visit shows "Authentication Required", where the user is created (see sonarr.yaml).
            - name: CHAPTARR__AUTH__REQUIRED
              value: Enabled
            # Info, not debug: every log line is written to /config.
            - name: CHAPTARR__LOG__LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8789
          # /ping touches the database, so it only gates readiness; liveness stays a TCP check. The
          # first start runs the migrations (about 10 s on SQLite in a test pod); the 20-minute
          # startup window is Sonarr's, kept as a margin for a busy node.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 240
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: chaptarr-config
        - name: data
          persistentVolumeClaim:
            claimName: multimedia
---
# LAN and tailnet only, on the shared 192.168.1.234 (the router forwards nothing to it).
# Friendly name chaptarr.lan.gemberkoekje.nl. In-cluster clients use
# chaptarr.zeef.svc.cluster.local:8789.
apiVersion: v1
kind: Service
metadata:
  name: chaptarr
  namespace: zeef
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.234
    metallb.io/allow-shared-ip: zeef-lan
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: chaptarr
  ports:
    - name: http
      port: 8789
      targetPort: http
