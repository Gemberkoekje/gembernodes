# Radarr. Films: picks releases (TRaSH formats via Recyclarr), grabs them through qBittorrent
# and hardlinks finished films into /data/Movies.
# Its database is in the shared PostgreSQL (radarr-main, radarr-log); settings via RADARR__* env vars.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: zeef
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      # No fsGroup: the kubelet would chown every file on /data, which is the media library.
      # The image drops to PUID/PGID itself.
      enableServiceLinks: false
      initContainers:
        # Start only once PostgreSQL answers, instead of crash-looping through a reboot.
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgresql.flux-system.svc.cluster.local -p 5432 -t 2; do echo "waiting for postgres"; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:6.4.4.10685-ls325
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "002"
            - name: TZ
              value: Europe/Amsterdam
            - name: RADARR__POSTGRES__HOST
              value: postgresql.flux-system.svc.cluster.local
            - name: RADARR__POSTGRES__PORT
              value: "5432"
            - name: RADARR__POSTGRES__USER
              value: radarr
            - name: RADARR__POSTGRES__MAINDB
              value: radarr-main
            - name: RADARR__POSTGRES__LOGDB
              value: radarr-log
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zeef-stack
                  key: RADARR__POSTGRES__PASSWORD
            # The API key comes from 1Password, so Prowlarr, Recyclarr, Cleanuparr and Zeef use
            # the same value without anyone copying it out of a UI.
            - name: RADARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: zeef-stack
                  key: RADARR__AUTH__APIKEY
            # Login always required. The method is deliberately not set here: with it preset, the
            # app skips its first-run "Authentication Required" screen, which is where the user is
            # created, and shows a login page nobody can pass. On the first visit choose Forms
            # and create the user; the app saves the method in config.xml itself.
            - name: RADARR__AUTH__REQUIRED
              value: Enabled
            - name: RADARR__LOG__ANALYTICSENABLED
              value: "False"
            # The apps start at "debug": ~11 log lines a second for Sonarr while it weighs
            # releases, each written to /config on the QNAP's synced, single-disk volume. That
            # slowed release processing to about one per second (2026-11-06). Info is the normal
            # level; debug can be switched on in the UI for troubleshooting.
            - name: RADARR__LOG__LEVEL
              value: info
          ports:
            - name: http
              containerPort: 7878
          # /ping touches the database, so it only gates readiness; liveness stays a TCP check
          # (a PostgreSQL outage must not restart a healthy pod). The first start on an empty
          # database runs ~250 migrations, which took over 5 minutes on 2026-11-06 (PostgreSQL's
          # data is on NFS); a major upgrade can take as long. Hence 20 minutes to start.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 240
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: data
          persistentVolumeClaim:
            claimName: multimedia
---
# LAN and tailnet only, on the shared 192.168.1.234 (the router forwards nothing to it).
# In-cluster clients use radarr.zeef.svc.cluster.local:7878.
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: zeef
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.234
    metallb.io/allow-shared-ip: zeef-lan
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: radarr
  ports:
    - name: http
      port: 7878
      targetPort: http
