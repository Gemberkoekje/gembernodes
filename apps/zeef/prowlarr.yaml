# Prowlarr. Indexers: searches the torrent indexers and syncs them into Sonarr and Radarr.
# It never touches the media share.
# Its database is in the shared PostgreSQL (prowlarr-main, prowlarr-log); settings via PROWLARR__* env vars.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: zeef
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      enableServiceLinks: false
      initContainers:
        # Start only once PostgreSQL answers, instead of crash-looping through a reboot.
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgresql.flux-system.svc.cluster.local -p 5432 -t 2; do echo "waiting for postgres"; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls167
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: UMASK
              value: "002"
            - name: TZ
              value: Europe/Amsterdam
            - name: PROWLARR__POSTGRES__HOST
              value: postgresql.flux-system.svc.cluster.local
            - name: PROWLARR__POSTGRES__PORT
              value: "5432"
            - name: PROWLARR__POSTGRES__USER
              value: prowlarr
            - name: PROWLARR__POSTGRES__MAINDB
              value: prowlarr-main
            - name: PROWLARR__POSTGRES__LOGDB
              value: prowlarr-log
            - name: PROWLARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zeef-stack
                  key: PROWLARR__POSTGRES__PASSWORD
            # The API key comes from 1Password, so Prowlarr, Recyclarr, Cleanuparr and Zeef use
            # the same value without anyone copying it out of a UI.
            - name: PROWLARR__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: zeef-stack
                  key: PROWLARR__AUTH__APIKEY
            # Login always required. The method is deliberately not set here: with it preset, the
            # app skips its first-run "Authentication Required" screen, which is where the user is
            # created, and shows a login page nobody can pass. On the first visit choose Forms
            # and create the user; the app saves the method in config.xml itself.
            - name: PROWLARR__AUTH__REQUIRED
              value: Enabled
            - name: PROWLARR__LOG__ANALYTICSENABLED
              value: "False"
          ports:
            - name: http
              containerPort: 9696
          # /ping touches the database, so it only gates readiness; liveness stays a TCP check
          # (a PostgreSQL outage must not restart a healthy pod). The first start on an empty
          # database runs ~250 migrations, which took over 5 minutes on 2026-11-06 (PostgreSQL's
          # data is on NFS); a major upgrade can take as long. Hence 20 minutes to start.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 240
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
---
# LAN and tailnet only, on the shared 192.168.1.234 (the router forwards nothing to it).
# In-cluster clients use prowlarr.zeef.svc.cluster.local:9696.
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: zeef
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.234
    metallb.io/allow-shared-ip: zeef-lan
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: http
