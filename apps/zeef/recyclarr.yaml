# Recyclarr: every night it pushes the TRaSH Guides' quality profiles, custom formats and quality
# definitions into Sonarr and Radarr. That is the "no junk" filter for films and series: it rejects
# CAM/TS releases, low-quality groups and bad encodes, and ranks good groups higher. Existing custom
# formats with the same names are replaced, so no state has to survive between runs.
# Run it now: kubectl -n zeef create job --from=cronjob/recyclarr recyclarr-manual
#
# Naming is not synced from here: Recyclarr only offers the guide's naming presets, and the library
# uses its own "Title (Year)" layout. It is set once in Sonarr/Radarr (projects Zeef/DEPLOY.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: zeef
data:
  recyclarr.yml: |
    # yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
    sonarr:
      series:
        base_url: http://sonarr.zeef.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY
        # Sonarr has one size table. It stays the guide's series table, except that the qualities
        # only the anime profile allows get the guide's anime minimum (5 MB/min): anime comes
        # mostly as Blu-ray/DVD encodes (often HEVC), far smaller than the live-action minimum
        # (50.4 MB/min for Bluray-1080p). The WEB-1080p profile allows none of these qualities, so
        # live-action series are unaffected. DVD/480p have no row in the series table.
        quality_definition:
          type: series
          qualities:
            - name: Bluray-1080p
              min: 5
            - name: Bluray-1080p Remux
              min: 5
            - name: Bluray-720p
              min: 5
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            reset_unmatched_scores:
              enabled: true
          # Anime (2026-11-07). The series profile above allows only WEB-1080p and rejects x265,
          # which shuts out most anime: older shows exist only as Blu-ray/DVD (Clannad, Strawberry
          # Marshmallow: 0 of 300+ releases acceptable), and SubsPlease names no source, so Sonarr
          # reads it as HDTV-1080p. This profile allows Blu-ray, WEB/HDTV and DVD and ranks the
          # guide's anime release-group tiers (raws, LQ groups and dub-only releases score low).
          # - min_format_score 0 instead of the guide's 100: an untiered fansub group is still
          #   better than nothing (Bazarr adds English subtitles if it has none).
          # - No upgrades: the first acceptable release stays, as with Cleanuparr's Seeker
          #   (proactive upgrade searches off), so files aren't replaced by ever larger ones.
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
            reset_unmatched_scores:
              enabled: true
            min_format_score: 0
            upgrade:
              allowed: false
        # As the guide's web-1080p template. Each group is pinned to WEB-1080p with
        # assign_scores_to: without it a group scores every profile, and Golden Rule HD's
        # x265 (HD) -10000 would reject the HEVC releases the anime profile is for.
        custom_format_groups:
          add:
            - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
              assign_scores_to:
                - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4  # [Optional] Language Profiles
              assign_scores_to:
                - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
              assign_scores_to:
                - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
              assign_scores_to:
                - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            # Releases with an audio-description track or a sign-language interpreter in the
            # picture score -10000, so they're only taken when nothing else exists (2026-11-06).
            - trash_id: bad5bc85573a0134e1e1987c46f67e98  # [Optional] Accessibility
              assign_scores_to:
                - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
              select:
                - 44ccbcbc74506f208973e1463b11705f  # WiTH AD
                - c196536ea8122397c5854040d01f2aa7  # WiTH ASL
                - b40dc2e630723745aab9f1b94f4aab74  # WiTH BASL
                - 0aef382c4ed4c5eb5d40109dfd351b72  # WiTH BSL
        media_management:
          propers_and_repacks: do_not_prefer

    radarr:
      movies:
        base_url: http://radarr.zeef.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY
        quality_definition:
          type: movie
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
        # As the guide's hd-bluray-web template.
        custom_format_groups:
          add:
            - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
            # As for Sonarr: audio description / sign-language releases score -10000.
            - trash_id: bc3c13e52f2971319bc1748ffa3d1078  # [Optional] Accessibility
              select:
                - 127bdbadcf3e4463a8c707759fbaad75  # WiTH AD
                - 09c60ba54fadb511c6986a7edec4da4b  # WiTH ASL
                - 41e4baea7b10ddefc6609d52f742dacd  # WiTH BASL
                - e205c5ba6be76b472903f4aec97fdb4b  # WiTH BSL
        media_management:
          propers_and_repacks: do_not_prefer
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: zeef
spec:
  schedule: "30 5 * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.8.1
              imagePullPolicy: IfNotPresent
              # The image's entrypoint runs the given command once instead of its cron daemon.
              args: ["sync"]
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: TZ
                  value: Europe/Amsterdam
                - name: RECYCLARR_CONFIG_DIR
                  value: /config
                - name: RECYCLARR_DATA_DIR
                  value: /work
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: zeef-stack
                      key: SONARR__AUTH__APIKEY
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: zeef-stack
                      key: RADARR__AUTH__APIKEY
              volumeMounts:
                # /config stays writable (an emptyDir); only recyclarr.yml comes from the ConfigMap.
                - name: config
                  mountPath: /config
                - name: config-file
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 384Mi
          volumes:
            - name: config
              emptyDir: {}
            - name: config-file
              configMap:
                name: recyclarr-config
            - name: work
              emptyDir: {}
