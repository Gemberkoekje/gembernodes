apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# Never prune the Namespace Flux runs in. gotk-components.yaml is generated, so the annotation
# goes on here; see namespaces/flux-system-namespace.yaml for why.
patches:
- patch: |-
    apiVersion: v1
    kind: Namespace
    metadata:
      name: flux-system
      annotations:
        kustomize.toolkit.fluxcd.io/prune: disabled
