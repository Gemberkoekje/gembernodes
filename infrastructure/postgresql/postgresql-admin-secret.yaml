# The PostgreSQL superuser's password, field "postgresPassword" of the 1Password item
# vaults/Gembercluster/items/postgresql-admin-secret. The backup CronJob reads it
# (infrastructure/postgresql-backup). The same item's `username`/`password` fields are the
# CloudNativePG Cluster's superuser (postgresql-superuser-secret.yaml); keep the two passwords equal.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: postgresql-admin-secret
  namespace: flux-system
spec:
  itemPath: "vaults/Gembercluster/items/postgresql-admin-secret"
