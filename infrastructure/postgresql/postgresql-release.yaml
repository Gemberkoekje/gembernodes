apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: flux-system
spec:
  interval: 11m
  # A pod start waits for the data volume to be mounted and PostgreSQL to recover. With the 5m
  # default a slow start timed out the upgrade, and the rollback restarted PostgreSQL again.
  timeout: 15m
  install:
    remediation:
      retries: 3
  # No `force`: a forced upgrade replaces whole objects instead of patching them, dropping
  # anything other controllers set on them.
  upgrade:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: postgresql-chart
    namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: postgresql-admin-secret
      valuesKey: postgresPassword
      targetPath: global.postgresql.auth.postgresPassword
  values:
    # Bitnami's free images are only published as `latest`, which the chart uses by default.
    # That tag moves (it already went from the chart's 18.3 to 18.4), and a pull after it moves
    # to a new major would start PostgreSQL against an incompatible data directory. Pin the
    # exact image; bump the digest deliberately after reading the release notes.
    image:
      digest: sha256:ac855a024049fc14d6b73e38ae3b53cf2d93ae69bf7c6174eda550a5de6f5227
    primary:
      # With the chart's default (Always) the kubelet re-applies fsGroup 1001 to every file of
      # the data directory over NFS on each pod start, which took 4+ minutes. OnRootMismatch
      # skips that when the volume root already has the right ownership.
      podSecurityContext:
        fsGroupChangePolicy: OnRootMismatch
      resourcesPreset: "none"
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "1000m"
          memory: "1Gi"
      # SIGTERM makes PostgreSQL do a "smart" shutdown, which waits for every client to
      # disconnect. The apps hold pooled connections, so it never finishes and the kubelet
      # SIGKILLs it (crash recovery on the next start). A fast shutdown disconnects clients
      # and checkpoints cleanly well within the grace period.
      terminationGracePeriodSeconds: 60
      lifecycleHooks:
        preStop:
          exec:
            command:
              - /bin/sh
              - -c
              - /opt/bitnami/postgresql/bin/pg_ctl stop -D /bitnami/postgresql/data -m fast -w -t 50
      # Crash recovery over NFS (syncing the data directory, redo, the end-of-recovery
      # checkpoint) takes 60-80 s, and longer while the QNAP is busy. On 2026-11-06 the chart's
      # liveness probe (a restart ~90 s after start) killed PostgreSQL in its end-of-recovery
      # checkpoint four times in a row, each kill forcing a new recovery. The startup probe gives
      # a start 15 minutes, as long as this HelmRelease's timeout; liveness and readiness only
      # begin once it has passed.
      startupProbe:
        enabled: true
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 90
      # Restarting a database that is stalled on slow storage only adds a crash recovery. The
      # chart's default restarted it after 60 s without an answer (6 x 10 s); now 3 minutes.
      livenessProbe:
        enabled: true
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 18
      # Keep PostgreSQL memory usage bounded for small clusters.
      extendedConfiguration: |
        shared_buffers = 256MB
        work_mem = 4MB
        maintenance_work_mem = 64MB
        effective_cache_size = 768MB
        # Keep WAL growth bounded so disk usage is more predictable.
        max_wal_size = 2GB
        min_wal_size = 256MB
        checkpoint_timeout = 10min
        checkpoint_completion_target = 0.9
        wal_compression = on
      # Reachable on the LAN at 192.168.1.232 through MetalLB. In-cluster clients should use
      # postgresql.flux-system.svc.cluster.local instead. This sets spec.loadBalancerIP; to
      # switch to the metallb.io/loadBalancerIPs annotation, remove this field in the same
      # change, because MetalLB rejects a Service that has both.
      service:
        type: LoadBalancer
        loadBalancerIP: 192.168.1.232
      persistence:
        enabled: true
        existingClaim: postgresql-data-qnap
