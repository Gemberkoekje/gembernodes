# The Helm chart also renders this Service (same name), so two controllers owned it and
# disagreed on its type. postgresql-release.yaml now declares the LoadBalancer itself.
# Step 2, in a later commit once this one has reconciled: delete this file and its line in
# kustomization.yaml. The prune-disabled annotation stops Flux from deleting the live
# Service (which Helm then keeps owning) when the file goes away.
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.232
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    app.kubernetes.io/name: postgresql
