# The CloudNativePG Cluster's superuser (configuration/postgresql-cluster.yaml): the same 1Password
# item as postgresql-admin-secret, read into the Cluster's namespace. CloudNativePG reads the
# `username` (postgres) and `password` fields; `password` holds the same value as `postgresPassword`,
# because the apps and the backup that connect as postgres keep their password.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: postgresql-superuser
  namespace: postgresql
spec:
  itemPath: "vaults/Gembercluster/items/postgresql-admin-secret"
