apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: cert-manager
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  targetNamespace: cert-manager
  install:
    createNamespace: true
  values:
    installCRDs: true
    global:
      leaderElection:
        namespace: cert-manager
    # Gateway API support: issues the certificates that the listeners of the public Gateway
    # (infrastructure/traefik/gateway.yaml) name, and answers ACME HTTP-01 challenges with
    # temporary HTTPRoutes (ClusterIssuer letsencrypt-gateway in configuration/).
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      gatewayAPI:
        enabled: true