apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: connect
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: connect
      version: "2.4.1"
      sourceRef:
        kind: HelmRepository
        name: onepassword
        namespace: flux-system
  values:
    operator:
      create: true
      # Lets OnePasswordItem annotations (e.g. Reflector's reflection-* keys) propagate onto
      # the generated Secret -- off by default, so ghcr-login mirroring silently no-ops without it.
      enableAnnotations: true
  # Make sure the Secret exists in the same namespace