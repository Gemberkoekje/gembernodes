# Jellyfin's settings, users, watched status and artwork live in SQLite, and Jellyfin 12 supports
# nothing else. SQLite on NFS corrupts, so this claim is on local-path, the disk of whichever node
# first runs the pod. The pod stays on that node from then on, and is away while kured reboots it.
# Jellyfin's scheduled backups go to jellyfin-backup on the QNAP. Flux never prunes this claim:
# with local-path's Delete policy, removing it would delete the data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: zeef
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-backup
  namespace: zeef
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: qnap-nfs
  resources:
    requests:
      storage: 5Gi
---
# Seerr's settings.json and logs. Its database is in the shared PostgreSQL (database seerr).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config
  namespace: zeef
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: qnap-nfs
  resources:
    requests:
      storage: 1Gi
---
# Bazarr's config.yaml, logs and cache. Its database is in the shared PostgreSQL (database bazarr).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  namespace: zeef
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: qnap-nfs
  resources:
    requests:
      storage: 1Gi
---
# Maintainerr's rules, collections and history: SQLite only (no PostgreSQL support), so this is on
# local-path like Jellyfin's config, never NFS. Flux never prunes it (local-path deletes data with
# the claim). Losing it means re-creating the cleanup rules, nothing else.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maintainerr-data
  namespace: zeef
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# Audiobookshelf's settings, users and listening progress: SQLite only, so this is on local-path
# like Jellyfin's config, never NFS. The pod stays on the node that first ran it. Flux never prunes
# it (local-path deletes data with the claim). Its scheduled backups go to audiobookshelf-metadata
# on the QNAP.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-config
  namespace: zeef
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# Audiobookshelf's /metadata: covers, image cache, logs and backups/ (its own scheduled backups of
# the database). No database lives here, so NFS is fine.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-metadata
  namespace: zeef
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: qnap-nfs
  resources:
    requests:
      storage: 5Gi
---
# Chaptarr's config.xml, covers, logs and its SQLite databases (chaptarr.db, logs.db, cache.db,
# staging.db, WAL mode). SQLite on NFS corrupts, so this is on local-path like Jellyfin's config; the
# pod stays on the node that first ran it. Flux never prunes it (local-path deletes data with the
# claim). Losing it costs Chaptarr's settings and its list of books; the audiobook files themselves
# are on the QNAP, in Audiobooks/, and can be imported again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chaptarr-config
  namespace: zeef
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
