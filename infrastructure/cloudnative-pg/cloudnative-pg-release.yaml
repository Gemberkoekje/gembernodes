# The CloudNativePG operator: it runs the PostgreSQL Cluster in configuration/postgresql-cluster.yaml
# (namespace postgresql). The chart also installs the postgresql.cnpg.io CRDs and the webhooks that
# check Cluster objects, which is why the Cluster lives in configuration/, applied after this.
# docs/cloudnativepg-migration-plan.md has the why.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  releaseName: cloudnative-pg
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      version: "0.29.x"
  interval: 1h0m0s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi
