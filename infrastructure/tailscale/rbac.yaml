# Lets the subnet router keep its Tailscale state in the Secret subnet-router-state
# (TS_KUBE_SECRET in subnet-router.yaml), as Tailscale's own Kubernetes examples do.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: subnet-router
  namespace: tailscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: subnet-router
  namespace: tailscale
rules:
  # The pod creates the Secret on its first start; create can't be limited to one name.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["subnet-router-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: subnet-router
  namespace: tailscale
subjects:
  - kind: ServiceAccount
    name: subnet-router
    namespace: tailscale
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: subnet-router
