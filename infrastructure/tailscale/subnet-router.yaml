# A Tailscale subnet router: devices on the tailnet reach the cluster's LAN addresses through this
# pod, so the internal UIs (http://lan.gemberkoekje.nl and its <app>.lan names on 192.168.1.236,
# Grafana included) work from anywhere, with the same URLs as at home.
# It runs in the cluster rather than on the nodes so it can be deployed and fixed through Git when
# nobody can reach the LAN. Setup in Tailscale and 1Password: NOTES.md, 2026-10-04.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subnet-router
  namespace: tailscale
  labels:
    app: subnet-router
spec:
  replicas: 1
  # Two pods on one state Secret would be the same tailnet device twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: subnet-router
  template:
    metadata:
      labels:
        app: subnet-router
    spec:
      serviceAccountName: subnet-router
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.102.5
          env:
            - name: TS_HOSTNAME
              value: gembercluster
            # The nodes (.201-.203) and MetalLB's pool (.230-.239), not the whole 192.168.1.0/24:
            # many other networks use that /24 too, and these narrower routes win over it on a
            # phone or laptop that is on such a network.
            - name: TS_ROUTES
              value: 192.168.1.200/29,192.168.1.224/28
            # Userspace networking needs no privileges and still routes. Traffic reaches the LAN
            # from the pod IP, which grafana-internal's allowlist (10.0.0.0/8) accepts.
            - name: TS_USERSPACE
              value: "true"
            # The device's keys live in this Secret, so restarts and reschedules (kured) keep the
            # same tailnet device. Created by the pod; Flux doesn't manage it.
            - name: TS_KUBE_SECRET
              value: subnet-router-state
            # Use the auth key only when there is no state yet: once logged in, the pod no longer
            # needs it, so the key may expire or be single-use.
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-authkey
                  key: password
            # Go doesn't see the container's memory limit and lets its heap grow to about twice
            # the live data before collecting. This makes it collect well before the hard limit.
            - name: GOMEMLIMIT
              value: "768MiB"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Userspace networking ends every forwarded TCP connection in this pod and buffers both
          # sides, so a video stream costs memory: one Jellyfin stream took 100-200 MiB. At 256 MiB
          # two streams hit the limit (2026-11-11): the kernel kept evicting tailscaled's own code
          # and reading it back (~300 MB/s from node-02's disk, iowait up to 50%), playback stalled,
          # and then the OOM kill dropped every tailnet connection. Devices at home use this pod
          # too when Tailscale is on, because these routes are narrower than the home /24.
          resources:
            requests:
              cpu: "10m"
              memory: "128Mi"
            limits:
              memory: "1Gi"
