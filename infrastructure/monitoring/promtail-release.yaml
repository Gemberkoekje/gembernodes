apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: monitoring
spec:
  chart:
    spec:
      chart: promtail
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      version: "6.x"
  interval: 5m
  values:
    # The chart's default kubernetes-pods job ships every container log with namespace, pod,
    # container and app labels. Loki 3 detects log levels on ingest and stores them as the
    # detected_level structured metadata, so no custom pipeline is needed for level filtering.
    config:
      clients:
        - url: http://grafana-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    resources:
      limits:
        cpu: 200m
        memory: 200Mi
      requests:
        cpu: 100m
        memory: 100Mi
