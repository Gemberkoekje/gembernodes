# grafana-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  chart:
    spec:
      chart: grafana
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
      # Chart 11.x is Grafana 12. Chart 13 and later (Grafana 13) move to a distroless image and
      # move dashboards into unified storage on first start: a separate step.
      version: "11.x"
  interval: 6m
  values:
    replicas: 1
    # Merged into the chart's pod securityContext (fsGroup 472): only re-apply the group to the
    # NFS volume when its root doesn't match, instead of to every file on each start.
    securityContext:
      fsGroupChangePolicy: OnRootMismatch
    admin:
      existingSecret: grafana-secret
      userKey: user
      passwordKey: password
    service:
      type: ClusterIP
    ingress:
      enabled: false
    persistence:
      enabled: true
      size: 2Gi
      storageClassName: "qnap-nfs"
      accessModes:
        - ReadWriteOnce
      existingClaim: grafana-qnap
    grafana.ini:
      server:
        # Grafana is reached at https://grafana.lan.gemberkoekje.nl (LAN and Tailscale only), through
        # the LAN name switchboard in infrastructure/lan-proxy. root_url is built from this, and so
        # are the links in alert emails. On the LAN, http://192.168.1.231/grafana (Traefik, through
        # grafana-internal-route.yaml) works too.
        domain: grafana.lan.gemberkoekje.nl
        # https: the name is served with a Let's Encrypt certificate by infrastructure/lan-proxy.
        root_url: "https://%(domain)s/grafana/"
        serve_from_sub_path: true
      smtp:
        enabled: true
        host: smtp.gmail.com:587
        user: gemberkoekje@gmail.com
        password: $__env{SMTP_PASSWORD}
        from_address: gemberkoekje@gmail.com
        from_name: Gembercluster
        startTLS_policy: MandatoryStartTLS
      # The Infinity data source, for the SpaceTraders snapshots dashboard (SpaceTraders PLAN.md slice 2.15). Pinned,
      # so a Grafana bump decides when it moves: 4.x needs Grafana 12.2.5 or later (on 12) and supports Grafana 13.
      # Grafana installs it from grafana.com in the background at start, next to its own preinstalled plugins, and
      # keeps it on its volume, so later starts don't fetch it again. A start that can't reach grafana.com only logs
      # it. The chart's `plugins` value would instead stop Grafana.
      plugins:
        preinstall: yesoreyeram-infinity-datasource@4.1.6
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://prometheus-server.monitoring.svc.cluster.local:80
            isDefault: true
          - name: grafana-Loki
            type: loki
            uid: grafana-loki
            access: proxy
            url: http://grafana-loki.monitoring.svc.cluster.local:3100
            isDefault: false
          # The SpaceTraders bot's internal API, with its API key, for the snapshots dashboard (SpaceTraders PLAN.md
          # slice 2.15, D73). Infinity reads its base URL from jsonData.url; Grafana's data source proxy, through which
          # the dashboard's links download a snapshot as a file, from url. The key is the one the bot's dashboard
          # already hands every browser that opens it (B22), so it also lets a Grafana user call the API's PUT and
          # POST endpoints, through the proxy or an Infinity query (which allows POST).
          - name: SpaceTraders API
            type: yesoreyeram-infinity-datasource
            uid: spacetraders-api
            access: proxy
            url: http://spacetraders-api-service.spacetraders.svc.cluster.local/spacetraders/api
            isDefault: false
            jsonData:
              url: http://spacetraders-api-service.spacetraders.svc.cluster.local/spacetraders/api
              allowedHosts:
                - http://spacetraders-api-service.spacetraders.svc.cluster.local
              httpHeaderName1: X-Api-Key
            secureJsonData:
              httpHeaderValue1: $__env{SPACETRADERS_INTERNAL_API_KEY}
    # Dashboards live as JSON in ./dashboards; kustomization.yaml generates them into the
    # grafana-dashboards ConfigMap, which the chart mounts at the provider path below.
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: Gembercluster
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboardsConfigMaps:
      default: grafana-dashboards
    initChownData:
      enabled: false
    extraConfigmapMounts:
      - name: alerting-provisioning
        mountPath: /etc/grafana/provisioning/alerting
        configMap: grafana-alerting-provisioning
        readOnly: true
    envFromSecret: grafana-smtp-secret
    # The bot's API key, for the SpaceTraders API data source above (spacetraders-secrets.yaml). Optional: without it
    # Grafana still starts, and only the snapshots dashboard fails, with the bot's 401.
    envValueFrom:
      SPACETRADERS_INTERNAL_API_KEY:
        secretKeyRef:
          name: spacetraders-secrets
          key: SPACETRADERS_INTERNAL_API_KEY
          optional: true
    env:
      GF_SECRETS_ENCRYPTION_PROVIDER: ""
