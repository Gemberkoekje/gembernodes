# grafana-release.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  chart:
    spec:
      chart: grafana
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      version: "8.x"
  interval: 6m
  values:
    replicaCount: 1
    # Merged into the chart's pod securityContext (fsGroup 472): only re-apply the group to the
    # NFS volume when its root doesn't match, instead of to every file on each start.
    securityContext:
      fsGroupChangePolicy: OnRootMismatch
    admin:
      existingSecret: grafana-secret
      userKey: user
      passwordKey: password
    service:
      type: ClusterIP
    ingress:
      enabled: false
    persistence:
      enabled: true
      size: 2Gi
      storageClassName: "qnap-nfs"
      accessModes:
        - ReadWriteOnce
      existingClaim: grafana-qnap
    grafana.ini:
      server:
        # Grafana is reached on the LAN through the ingress-nginx VIP (grafana-internal-ingress.yaml).
        # root_url is built from this, and so are the links in alert emails.
        domain: 192.168.1.230
        root_url: "%(protocol)s://%(domain)s/grafana/"
        serve_from_sub_path: true
      smtp:
        enabled: true
        host: smtp.gmail.com:587
        user: gemberkoekje@gmail.com
        password: $__env{SMTP_PASSWORD}
        from_address: gemberkoekje@gmail.com
        from_name: Gembercluster
        startTLS_policy: MandatoryStartTLS
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://prometheus-server.monitoring.svc.cluster.local:80
            isDefault: true
          - name: grafana-Loki
            type: loki
            uid: grafana-loki
            access: proxy
            url: http://grafana-loki.monitoring.svc.cluster.local:3100
            isDefault: false
    # Dashboards live as JSON in ./dashboards; kustomization.yaml generates them into the
    # grafana-dashboards ConfigMap, which the chart mounts at the provider path below.
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: Gembercluster
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboardsConfigMaps:
      default: grafana-dashboards
    initChownData:
      enabled: false
    extraConfigmapMounts:
      - name: alerting-provisioning
        mountPath: /etc/grafana/provisioning/alerting
        configMap: grafana-alerting-provisioning
        readOnly: true
    envFromSecret: grafana-smtp-secret
    env:
      GF_SECRETS_ENCRYPTION_PROVIDER: ""
