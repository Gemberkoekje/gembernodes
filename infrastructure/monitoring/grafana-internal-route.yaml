# Grafana by IP on the LAN: http://192.168.1.231/grafana. Its main address is
# https://grafana.lan.gemberkoekje.nl (infrastructure/lan-proxy). No hostname, plain HTTP, and only
# LAN and cluster addresses (Tailscale arrives from the subnet router's pod IP, in 10.0.0.0/8).
# A route without a hostname applies to any host on port 80, and Traefik ranks the longer path above
# a hostname match, so /grafana wins on every hostname's port 80; the allowlist keeps it LAN-only.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: monitoring
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/16
      - 10.0.0.0/8
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-internal
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      namespace: traefik
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: lan-only
      backendRefs:
        - name: grafana
          port: 80
