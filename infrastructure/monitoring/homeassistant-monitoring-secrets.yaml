# Home Assistant's 1Password item for monitoring, also in apps/home-assistant (its README,
# "Monitoring"). Fields used (exact labels):
# - HOMEASSISTANT_TOKEN: Prometheus scrapes Home Assistant with it (prometheus-release.yaml).
# - GRAFANA_WEBHOOK_ID: Grafana posts its alerts to that webhook (grafana-release.yaml, envValueFrom).
# Both are mounted or read optionally: without the item Prometheus and Grafana still start.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: homeassistant-monitoring
  namespace: monitoring
spec:
  itemPath: "vaults/Gembercluster/items/homeassistant-monitoring"
