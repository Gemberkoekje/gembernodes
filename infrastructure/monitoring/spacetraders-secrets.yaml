# The SpaceTraders bot's 1Password item, in the monitoring namespace too: Grafana reads its internal API key from it, for
# the SpaceTraders API data source (grafana-release.yaml, SpaceTraders PLAN.md slice 2.15). The operator copies every
# field of the item into the Secret; Grafana's pod gets only SPACETRADERS_INTERNAL_API_KEY (envValueFrom).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: spacetraders-secrets
  namespace: monitoring
spec:
  itemPath: "vaults/Gembercluster/items/spacetraders-secrets"
