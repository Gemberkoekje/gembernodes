apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheus-release.yaml
  - grafana-secret.yaml
  - grafana-smtp-secret.yaml
  - spacetraders-secrets.yaml
  - grafana-alerting-provisioning.yaml
  - grafana-release.yaml
  - loki-release.yaml
  - promtail-release.yaml
  - grafana-internal-ingress.yaml
# Provisioned into Grafana by grafana-release.yaml (dashboardsConfigMaps). The name must stay
# fixed because the HelmRelease references it, hence no hash suffix.
configMapGenerator:
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - dashboards/all-logs-dashboard.json
      - dashboards/cluster-health-dashboard.json
      - dashboards/error-logs-dashboard.json
      - dashboards/flux-dashboard.json
      - dashboards/spacetraders-dashboard.json
      - dashboards/spacetraders-markets-dashboard.json
      - dashboards/spacetraders-snapshots-dashboard.json
      - dashboards/spacetraders-systems-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
