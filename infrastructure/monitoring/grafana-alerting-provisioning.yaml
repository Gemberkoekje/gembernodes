apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-provisioning
  namespace: monitoring
data:
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: Email
        receivers:
          - uid: email-receiver
            type: email
            settings:
              addresses: Arie_Hofland@hotmail.com
              singleEmail: true
  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: Email
        group_by: ['namespace', 'alertname']
        group_wait: 1m
        group_interval: 5m
        repeat_interval: 12h
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: error-logs
        folder: Alerts
        interval: 5m
        rules:
          # One alert per namespace, so the email names the app. A counts the lines containing
          # "error"; B quotes the most frequent of them in its "line" label (cut at 300 characters).
          # B has more labels than A, which Grafana still matches to A's alert as $values.B, so a
          # new message doesn't become an alert of its own.
          # If any query returns nothing, Grafana treats the whole rule as NoData (OK: silent), so B
          # must never fail where A succeeds. Sharded, B hits Loki's 500-series limit once more than
          # 500 different lines match; min_sharding_lookback in loki-release.yaml prevents that.
          # The email's View dashboard/View panel buttons open dashboards/error-logs-dashboard.json
          # from an hour before the alert started; keep its namespace list in step with this one.
          # The SpaceTraders bot has a rule of its own, below.
          - uid: loki-error-logs
            title: Error logs detected
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: grafana-loki
                model:
                  refId: A
                  expr: 'sum by (namespace) (count_over_time({namespace=~"armabotcs|ebi-cs-api|vortexplotboek|cov-website|file-server"} |~ `(?i)error` [5m]))'
                  queryType: instant
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: grafana-loki
                model:
                  refId: B
                  expr: 'topk by (namespace) (1, sum by (namespace, line) (count_over_time({namespace=~"armabotcs|ebi-cs-api|vortexplotboek|cov-website|file-server"} |~ `(?i)error` | label_format line=`{{ regexReplaceAll "(?s)^(.{300}).+$" __line__ "${1}…" }}` [5m])))'
                  queryType: instant
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 5m
            annotations:
              summary: '{{ $labels.namespace }} logged {{ $values.A }} lines containing "error" in the last 5 minutes'
              description: |-
                {{ with $values.B }}Most frequent line ({{ . }} of {{ $values.A }}):
                {{ .Labels.line }}{{ end }}
              __dashboardUid__: error-logs
              __panelId__: "2"
          # The SpaceTraders bot (Gemberkoekje/projects, SpaceTraders/PLAN.md B44) logs Serilog's
          # compact JSON, whose ordinary lines contain "error" without being errors: setting names
          # (Health.Errors.*), library notes, its own RepeatingError anomaly. Its errors are the JSON
          # lines whose level ("@l") is Error or Fatal (Information has no "@l"), and the lines
          # that aren't JSON (nginx, the init container) containing "error", as above. Otherwise
          # the same as the rule above; the email opens the Errors panel of the bot's dashboard.
          - uid: spacetraders-error-logs
            title: SpaceTraders logged errors
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: grafana-loki
                model:
                  refId: A
                  expr: 'sum by (namespace) (count_over_time({namespace="spacetraders"} |~ `"@l":"(?:Error|Fatal)"|^[^{].*(?i:error)` [5m]))'
                  queryType: instant
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: grafana-loki
                model:
                  refId: B
                  expr: 'topk by (namespace) (1, sum by (namespace, line) (count_over_time({namespace="spacetraders"} |~ `"@l":"(?:Error|Fatal)"|^[^{].*(?i:error)` | label_format line=`{{ regexReplaceAll "(?s)^(.{300}).+$" __line__ "${1}…" }}` [5m])))'
                  queryType: instant
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 5m
            annotations:
              summary: 'SpaceTraders logged {{ $values.A }} error lines in the last 5 minutes'
              description: |-
                {{ with $values.B }}Most frequent line ({{ . }} of {{ $values.A }}):
                {{ .Labels.line }}{{ end }}
              __dashboardUid__: spacetraders
              __panelId__: "23"
      # The failures that went unnoticed for months (Loki stuck Pending, Flux HelmRelease failed)
      # would each have tripped one of these. Every query aggregates to one series per object,
      # keeping only the labels that identify it: each object alerts on its own, and the raw
      # scrape labels (chart, instance, ...) stay out of the email subject.
      - orgId: 1
        name: cluster-health
        folder: Alerts
        interval: 1m
        rules:
          - uid: flux-resource-not-ready
            title: Flux resource not ready
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max by (customresource_kind, exported_namespace, name) (gotk_resource_info{ready="False"})'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 15m
            annotations:
              summary: '{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has not been Ready for 15 minutes'
          - uid: pod-stuck-pending
            title: Pod stuck Pending
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'sum by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) > 0'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 15m
            annotations:
              summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} has been Pending for 15 minutes'
          - uid: container-failing
            title: Container crash-looping or failing to start
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'sum by (namespace, pod, container, reason) (kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError"}) > 0'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 15m
            annotations:
              summary: '{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} has been in {{ $labels.reason }} for 15 minutes'
          - uid: node-not-ready
            title: Node not ready
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max by (node) (kube_node_status_condition{condition="Ready", status!="true"})'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 10m
            annotations:
              summary: 'Node {{ $labels.node }} has not been Ready for 10 minutes'
          # The kubelet only removes unused images from 85% and evicts pods below 10% free, and old
          # images alone filled gembernode-01 to 74% (see NOTES.md for the prune command).
          - uid: node-disk-filling
            title: Node disk filling up
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max by (node) ((1 - node_filesystem_avail_bytes{mountpoint="/", fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/", fstype!="rootfs"}) * 100)'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 85
            noDataState: OK
            execErrState: Error
            for: 30m
            annotations:
              summary: 'Root disk on {{ $labels.node }} has been over 85% full for 30 minutes'
          # cert-manager renews 30 days before expiry, so under 14 days left means renewal is failing.
          - uid: certificate-expiring
            title: Certificate expiring
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'min by (namespace, name) ((certmanager_certificate_expiration_timestamp_seconds - time()) / 86400)'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: lt
                        params:
                          - 14
            noDataState: OK
            execErrState: Error
            for: 1h
            annotations:
              summary: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 14 days; renewal is failing'
      # The SpaceTraders bot (Gemberkoekje/projects, SpaceTraders/PLAN.md slice 2.5). Its metrics
      # come from the pod's port 9090, its log lines from Loki. "Bot is down" was paused while the
      # bot was off the cluster; it came back with apps/spacetraders (slices 4.2 and 4.3).
      - orgId: 1
        name: spacetraders
        folder: Alerts
        interval: 1m
        rules:
          - uid: spacetraders-down
            title: SpaceTraders bot is down
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max(max_over_time(up{namespace="spacetraders"}[10m]))'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: lt
                        params:
                          - 1
            # No series at all means no pod to scrape: that is down too.
            noDataState: Alerting
            execErrState: Error
            for: 1m
            annotations:
              summary: 'Prometheus has not scraped the SpaceTraders bot for 10 minutes'
          # The database size limits have a rule of their own below.
          - uid: spacetraders-anomaly
            title: SpaceTraders anomaly active
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max by (rule, subject) (spacetraders_anomaly_active{namespace="spacetraders", rule!~"DbSize.*"})'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 15m
            annotations:
              summary: 'SpaceTraders anomaly {{ $labels.rule }} on {{ $labels.subject }} has been active for 15 minutes'
          # The database shares the Postgres volume with every app: over the soft limit (the
          # Database.SoftLimitMegabytes setting, 1 GB by default) warns; over the hard limit
          # (3 GB) the bot switches its automation off.
          - uid: spacetraders-db-soft-limit
            title: SpaceTraders database over its soft limit
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max(spacetraders_anomaly_active{namespace="spacetraders", rule="DbSizeSoftLimit"})'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 5m
            annotations:
              summary: 'The SpaceTraders database is over its soft limit; over the hard limit the bot switches its automation off'
      # Loki keeps 31 days on 10Gi, shared with every app. The bot's budget grows with its fleet: 5,000 lines a day
      # per ship, about twice what a working ship logs (2,000 to 2,700 since SpaceTraders B53), so buying ships doesn't
      # pass it and a loop still does. Ships are averaged over the same 24 hours as the lines, so a reset, when the
      # fleet starts again from two ships, doesn't either. The bot logged about 12 MB of the cluster's 205 MB a day
      # on 2026-10-03.
      - orgId: 1
        name: spacetraders-logs
        folder: Alerts
        interval: 10m
        rules:
          - uid: spacetraders-log-volume
            title: SpaceTraders log volume over budget
            condition: D
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: grafana-loki
                model:
                  refId: A
                  expr: 'sum(count_over_time({namespace="spacetraders"}[24h]))'
                  queryType: instant
              # Ships, averaged over the last 24 hours: one spacetraders_ship_info series per ship, counted once
              # while two pods overlap in a deploy; at least 1.
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: B
                  expr: 'clamp_min(avg_over_time(count(count by (ship) (spacetraders_ship_info{namespace="spacetraders"}))[24h:5m]), 1)'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: math
                  expression: '$A / $B'
              - refId: D
                datasourceUid: "__expr__"
                model:
                  refId: D
                  type: threshold
                  expression: C
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 5000
            noDataState: OK
            execErrState: Error
            for: 0s
            annotations:
              summary: 'SpaceTraders logged {{ $values.A }} lines in the last 24 hours with {{ $values.B }} ships on average: {{ $values.C }} a ship, over its budget of 5,000'
