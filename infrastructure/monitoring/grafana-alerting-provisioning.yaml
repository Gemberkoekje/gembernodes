apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-provisioning
  namespace: monitoring
data:
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: Email
        receivers:
          - uid: email-receiver
            type: email
            settings:
              addresses: Arie_Hofland@hotmail.com
              singleEmail: true
          # Every alert also goes to Home Assistant, which shows it as a notification there and on
          # the phone, and clears it when it resolves (apps/home-assistant/configuration.yaml,
          # "automation git"). The webhook ID is a secret: GRAFANA_WEBHOOK_ID (grafana-release.yaml).
          # Grafana fills environment variables into contact point settings (not into rules), so
          # a literal $ here would need to be $$. Without the ID it posts to an empty one, which
          # fails in Grafana's log; the email goes regardless.
          - uid: home-assistant-receiver
            type: webhook
            settings:
              url: http://homeassistant.home-automation.svc.cluster.local:8123/api/webhook/$__env{GRAFANA_WEBHOOK_ID}
              httpMethod: POST
  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: Email
        group_by: ['namespace', 'alertname']
        group_wait: 1m
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # The Kasboek warning (group kasboek below) repeats once a day while it lasts, at the same
          # time of day. Grafana repeats at the first group_interval tick after repeat_interval has
          # passed, so 24h would land on the tick after the 24-hour one and come 5 minutes later every
          # day; 23h55m lands on the 24-hour tick itself. Matched on the rule's title: keep both in step.
          - receiver: Email
            object_matchers:
              - ['alertname', '=', 'Kasboek below the burndown line']
            repeat_interval: 23h55m
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: error-logs
        folder: Alerts
        interval: 5m
        rules:
          # One alert per namespace, so the email names the app. A counts the lines containing
          # "error"; B quotes the most frequent of them in its "line" label (cut at 300 characters).
          # B has more labels than A, which Grafana still matches to A's alert as $values.B, so a
          # new message doesn't become an alert of its own.
          # If any query returns nothing, Grafana treats the whole rule as NoData (OK: silent), so B
          # must never fail where A succeeds. Sharded, B hits Loki's 500-series limit once more than
          # 500 different lines match; min_sharding_lookback in loki-release.yaml prevents that.
          # The email's View dashboard/View panel buttons open dashboards/error-logs-dashboard.json
          # from an hour before the alert started; keep its namespace list in step with this one.
          # The SpaceTraders bot has a rule of its own, below.
          - uid: loki-error-logs
            title: Error logs detected
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: grafana-loki
                model:
                  refId: A
                  expr: 'sum by (namespace) (count_over_time({namespace=~"armabotcs|ebi-cs-api|plotboek-generator|cov-website|file-server"} |~ `(?i)error` [5m]))'
                  queryType: instant
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: grafana-loki
                model:
                  refId: B
                  expr: 'topk by (namespace) (1, sum by (namespace, line) (count_over_time({namespace=~"armabotcs|ebi-cs-api|plotboek-generator|cov-website|file-server"} |~ `(?i)error` | label_format line=`{{ regexReplaceAll "(?s)^(.{300}).+$" __line__ "${1}…" }}` [5m])))'
                  queryType: instant
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 5m
            annotations:
              summary: '{{ $labels.namespace }} logged {{ $values.A }} lines containing "error" in the last 5 minutes'
              description: |-
                {{ with $values.B }}Most frequent line ({{ . }} of {{ $values.A }}):
                {{ .Labels.line }}{{ end }}
              __dashboardUid__: error-logs
              __panelId__: "2"
          # The SpaceTraders bot (Gemberkoekje/projects, SpaceTraders/PLAN.md B44) logs Serilog's
          # compact JSON, whose ordinary lines contain "error" without being errors: setting names
          # (Health.Errors.*), library notes, its own RepeatingError anomaly. Its errors are the JSON
          # lines whose level ("@l") is Error or Fatal (Information has no "@l"), and the lines
          # that aren't JSON (nginx, the init container) containing "error", as above. Otherwise
          # the same as the rule above; the email opens the Errors panel of the bot's dashboard.
          # The bot's errors come in long stretches of a few lines at a time (a ship failing the
          # same step every round, a slow query): each 5-minute window with none ended the alert and
          # the next error started it again, ~15 mails on the night of 2026-11-22. A 5-minute window
          # without errors returns nothing; with noDataState OK, Grafana (13) treats that as the
          # condition being false for the alert already there, so keepFiringFor holds it on for 30
          # minutes: it mails when errors start and when they have stopped for half an hour. Replayed
          # on that night: 1 mail.
          # While it fires, a new kind of error sends no mail of its own; the Errors panel lists them.
          - uid: spacetraders-error-logs
            title: SpaceTraders logged errors
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: grafana-loki
                model:
                  refId: A
                  expr: 'sum by (namespace) (count_over_time({namespace="spacetraders"} |~ `"@l":"(?:Error|Fatal)"|^[^{].*(?i:error)` [5m]))'
                  queryType: instant
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: grafana-loki
                model:
                  refId: B
                  expr: 'topk by (namespace) (1, sum by (namespace, line) (count_over_time({namespace="spacetraders"} |~ `"@l":"(?:Error|Fatal)"|^[^{].*(?i:error)` | label_format line=`{{ regexReplaceAll "(?s)^(.{300}).+$" __line__ "${1}…" }}` [5m])))'
                  queryType: instant
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 5m
            keepFiringFor: 30m
            annotations:
              summary: 'SpaceTraders logged {{ $values.A }} error lines in the last 5 minutes'
              description: |-
                {{ with $values.B }}Most frequent line ({{ . }} of {{ $values.A }}):
                {{ .Labels.line }}{{ end }}
              __dashboardUid__: spacetraders
              __panelId__: "23"
      # The failures that went unnoticed for months (Loki stuck Pending, Flux HelmRelease failed)
      # would each have tripped one of these. Every query aggregates to one series per object,
      # keeping only the labels that identify it: each object alerts on its own, and the raw
      # scrape labels (chart, instance, ...) stay out of the email subject.
      - orgId: 1
        name: cluster-health
        folder: Alerts
        interval: 1m
        rules:
          - uid: flux-resource-not-ready
            title: Flux resource not ready
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max by (customresource_kind, exported_namespace, name) (gotk_resource_info{ready="False"})'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 15m
            annotations:
              summary: '{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has not been Ready for 15 minutes'
          - uid: pod-stuck-pending
            title: Pod stuck Pending
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'sum by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) > 0'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 15m
            annotations:
              summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} has been Pending for 15 minutes'
          - uid: container-failing
            title: Container crash-looping or failing to start
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'sum by (namespace, pod, container, reason) (kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError"}) > 0'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 15m
            annotations:
              summary: '{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} has been in {{ $labels.reason }} for 15 minutes'
          # One alert per kill: the container's last exit was OOMKilled and it restarted in the last
          # 10 minutes. max_over_time also catches a crash-looping container whose OOMKilled reason
          # is overwritten by its next exit within a scrape or two (spacetraders-api, 2026-11-11).
          # Nothing alerted when the Tailscale subnet router was OOM-killed that night; it showed up
          # as stuttering Jellyfin streams. Backtested on 14 days: those two kills, nothing else.
          - uid: container-oom-killed
            title: Container killed for running out of memory
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: '(max by (namespace, pod, container) (max_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m])) == 1) and on (namespace, pod, container) (max by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[10m])) > 0)'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 0s
            annotations:
              summary: '{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} was killed for exceeding its memory limit and restarted. Raise its memory limit if this repeats'
          # The warning before the kill: over 90% of its memory limit and more than 50 major page
          # faults per second. The kernel is then evicting the container's own code and reading it
          # back from disk. That stalls the container and loads the node's disk: the router read
          # about 300 MB/s and pushed node-02's iowait to 50%. Either half alone is noisy (Promtail
          # did and qBittorrent does sit above 90% for hours without trouble), the faults are not. for: 1m
          # still catches the router's shortest episode (22:17-22:18). Backtested on 14 days: only
          # the router's three episodes on 2026-11-11.
          - uid: container-memory-thrashing
            title: Container thrashing at its memory limit
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: '(sum by (namespace, pod, container) (rate(container_memory_failures_total{failure_type="pgmajfault", scope="container", container!=""}[5m])) > 50) and on (namespace, pod, container) (max by (namespace, pod, container) (container_memory_working_set_bytes{container!="", container!="POD"}) / max by (namespace, pod, container) (container_spec_memory_limit_bytes{container!="", container!="POD"} > 0) > 0.9)'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 1m
            annotations:
              summary: '{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is at its memory limit and thrashing ({{ printf "%.0f" $values.A.Value }} major page faults/s). Raise its memory limit'
          # A backup CronJob whose last successful run is too old: the nightly ones (the PostgreSQL
          # dump and the SQLite copies in apps/zeef/sqlite-backup.yaml) after 26 hours, Jellyfin's
          # weekly one after 170. A failed or stuck run shows up here; a job that never succeeded
          # has no last-success time and stays silent, so check a new one by hand once.
          - uid: backup-stale
            title: Backup is stale
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max by (namespace, cronjob) ((time() - kube_cronjob_status_last_successful_time{cronjob=~"postgresql-backup|sqlite-backup-.+"}) / 3600 > 26) or max by (namespace, cronjob) ((time() - kube_cronjob_status_last_successful_time{cronjob="jellyfin-backup"}) / 3600 > 170)'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 0s
            annotations:
              summary: 'Backup {{ $labels.namespace }}/{{ $labels.cronjob }} last succeeded {{ printf "%.0f" $values.A.Value }} hours ago'
          - uid: node-not-ready
            title: Node not ready
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max by (node) (kube_node_status_condition{condition="Ready", status!="true"})'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 10m
            annotations:
              summary: 'Node {{ $labels.node }} has not been Ready for 10 minutes'
          # The kubelet only removes unused images from 85% and evicts pods below 10% free, and old
          # images alone filled gembernode-01 to 74% (see NOTES.md for the prune command).
          - uid: node-disk-filling
            title: Node disk filling up
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max by (node) ((1 - node_filesystem_avail_bytes{mountpoint="/", fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/", fstype!="rootfs"}) * 100)'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 85
            noDataState: OK
            execErrState: Error
            for: 30m
            annotations:
              summary: 'Root disk on {{ $labels.node }} has been over 85% full for 30 minutes'
          # cert-manager renews 30 days before expiry, so under 14 days left means renewal is failing.
          - uid: certificate-expiring
            title: Certificate expiring
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'min by (namespace, name) ((certmanager_certificate_expiration_timestamp_seconds - time()) / 86400)'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: lt
                        params:
                          - 14
            noDataState: OK
            execErrState: Error
            for: 1h
            annotations:
              summary: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 14 days; renewal is failing'
      # The SpaceTraders bot (Gemberkoekje/projects, SpaceTraders/PLAN.md slice 2.5). Its metrics
      # come from the pod's port 9090, its log lines from Loki. "Bot is down" was paused while the
      # bot was off the cluster; it came back with apps/spacetraders (slices 4.2 and 4.3).
      - orgId: 1
        name: spacetraders
        folder: Alerts
        interval: 1m
        rules:
          - uid: spacetraders-down
            title: SpaceTraders bot is down
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max(max_over_time(up{namespace="spacetraders"}[10m]))'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: lt
                        params:
                          - 1
            # No series at all means no pod to scrape: that is down too.
            noDataState: Alerting
            execErrState: Error
            for: 1m
            annotations:
              summary: 'Prometheus has not scraped the SpaceTraders bot for 10 minutes'
          # The database size limits and the ships' anomalies have rules of their own below.
          # RepeatingError (a log statement repeating) mails no more: its errors are what the
          # "SpaceTraders logged errors" alert above already mails, and each statement that started or
          # stopped repeating sent a mail of its own (5 on the night of 2026-11-22). Repeated warnings
          # go unmailed with it; the dashboard's "Active anomalies" table still lists them.
          - uid: spacetraders-anomaly
            title: SpaceTraders anomaly active
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max by (rule, subject) (spacetraders_anomaly_active{namespace="spacetraders", rule!~"DbSize.*|ShipLeftIdle|ShipStuck|RepeatingError"})'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 15m
            annotations:
              summary: 'SpaceTraders anomaly {{ $labels.rule }} on {{ $labels.subject }} has been active for 15 minutes'
          # The anomalies of single ships, one alert per rule (ShipLeftIdle, ShipStuck) instead of one per
          # ship. Per ship, every ship that crossed 15 minutes or cleared changed the alert group and sent
          # a mail: when the bot's plan tick slows down, dozens of probes go idle and clear in turn
          # (2026-11-21: a 14-minute tick, ~89 mails in 72 hours from ShipLeftIdle alone). A counts the
          # ships with the anomaly, and 0 while the rule has none, so the alert ends by its condition and
          # keepFiringFor applies. It fires once ships have had it for 15 minutes on end (not
          # necessarily the same ship) and ends an hour after the last one clears, so a slow tick mails
          # once at its start and once at its end; over those 72 hours, about 5 mails. The count in the
          # mail is the one at the time; the dashboard's "Active anomalies" table lists the ships.
          # missing_series_evals_to_resolve: a restart takes the series away for a few minutes; that
          # alone doesn't end it.
          - uid: spacetraders-ship-anomalies
            title: SpaceTraders ships with an anomaly
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'count by (rule) (max by (rule, subject) (spacetraders_anomaly_active{namespace="spacetraders", rule=~"ShipLeftIdle|ShipStuck"}) == 1) or (max by (rule) (spacetraders_anomaly_active{namespace="spacetraders", rule=~"ShipLeftIdle|ShipStuck"}) * 0)'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 15m
            keepFiringFor: 1h
            missing_series_evals_to_resolve: 15
            annotations:
              summary: 'SpaceTraders anomaly {{ $labels.rule }} is active on {{ printf "%.0f" $values.A.Value }} ships, and has been on at least one for 15 minutes'
              __dashboardUid__: spacetraders
              __panelId__: "20"
          # The database shares the Postgres volume with every app: over the soft limit (the
          # Database.SoftLimitMegabytes setting, 1 GB by default) warns; over the hard limit
          # (3 GB) the bot switches its automation off.
          - uid: spacetraders-db-soft-limit
            title: SpaceTraders database over its soft limit
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max(spacetraders_anomaly_active{namespace="spacetraders", rule="DbSizeSoftLimit"})'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 5m
            annotations:
              summary: 'The SpaceTraders database is over its soft limit; over the hard limit the bot switches its automation off'
      # Loki keeps 31 days on 10Gi, shared with every app. The bot's budget grows with its fleet: 5,000 lines a day
      # per ship, about twice what a working ship logs (2,000 to 2,700 since SpaceTraders B53), so buying ships doesn't
      # pass it and a loop still does. Ships are averaged over the same 24 hours as the lines, so a reset, when the
      # fleet starts again from two ships, doesn't either. The bot logged about 12 MB of the cluster's 205 MB a day
      # on 2026-10-03.
      - orgId: 1
        name: spacetraders-logs
        folder: Alerts
        interval: 10m
        rules:
          - uid: spacetraders-log-volume
            title: SpaceTraders log volume over budget
            condition: D
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: grafana-loki
                model:
                  refId: A
                  expr: 'sum(count_over_time({namespace="spacetraders"}[24h]))'
                  queryType: instant
              # Ships, averaged over the last 24 hours: one spacetraders_ship_info series per ship, counted once
              # while two pods overlap in a deploy; at least 1.
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: B
                  expr: 'clamp_min(avg_over_time(count(count by (ship) (spacetraders_ship_info{namespace="spacetraders"}))[24h:5m]), 1)'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: math
                  expression: '$A / $B'
              - refId: D
                datasourceUid: "__expr__"
                model:
                  refId: D
                  type: threshold
                  expression: C
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 5000
            noDataState: OK
            execErrState: Error
            for: 0s
            annotations:
              summary: 'SpaceTraders logged {{ $values.A }} lines in the last 24 hours with {{ $values.B }} ships on average: {{ $values.C }} a ship, over its budget of 5,000'
      - orgId: 1
        name: home-assistant
        folder: Alerts
        interval: 1m
        rules:
          # Prometheus reads Home Assistant's entities (prometheus-release.yaml, job homeassistant).
          # This fires when it can't: Home Assistant is down, or its token is missing or wrong (the
          # target's error on Prometheus's Targets page says which). 15 minutes, because
          # gembernode-01's nightly reboot keeps Home Assistant away for a few. While Home
          # Assistant is down this alert can't reach the phone through it; the email still goes.
          - uid: homeassistant-scrape-down
            title: Prometheus can't read Home Assistant
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 900
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: 'max(max_over_time(up{job="homeassistant"}[15m]))'
                  instant: true
              - refId: C
                datasourceUid: "__expr__"
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: lt
                        params:
                          - 1
            # No series at all means the job is gone from Prometheus's config: that is down too.
            noDataState: Alerting
            execErrState: Error
            for: 1m
            annotations:
              summary: 'Prometheus has not read Home Assistant for 15 minutes: Home Assistant is down, or its token is missing or wrong'
              __dashboardUid__: home-assistant
              __panelId__: "1"
      # Kasboek (apps/kasboek): the salary-month burndown on its dashboard, the salary account's
      # balance against a line that reaches € 0 on the day the next salary is due. This warns while
      # the balance is below that line, once a day: the route for it (policies.yaml) repeats it every
      # 24 hours while it lasts, and a mail and phone notification say when it's back above.
      # Kasboek serves the dashboard's own figures at /metrics (prometheus-release.yaml, job kasboek;
      # A is the shortfall, the difference turned round). They change when its bank pull runs (06:00
      # Amsterdam) or something is imported or filed, so the warning usually comes just after six.
      # Each query takes the newest value of the past hour, so a Kasboek restart or a node reboot (no
      # figures for a while) doesn't end the alert and start it again with a second mail. Without a
      # running salary month Kasboek leaves the figures out: NoData, OK.
      - orgId: 1
        name: kasboek
        folder: Alerts
        interval: 5m
        rules:
          - uid: kasboek-below-burndown-line
            title: Kasboek below the burndown line
            condition: F
            data:
              - refId: A
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  expr: '-max(last_over_time(kasboek_burndown_difference_euros[1h]))'
                  instant: true
              - refId: B
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: B
                  expr: 'max(last_over_time(kasboek_burndown_balance_euros[1h]))'
                  instant: true
              - refId: C
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: C
                  expr: 'max(last_over_time(kasboek_burndown_target_euros[1h]))'
                  instant: true
              - refId: D
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: D
                  expr: 'max(last_over_time(kasboek_burndown_last_known_age_days[1h]))'
                  instant: true
              - refId: E
                relativeTimeRange:
                  from: 3600
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: E
                  expr: 'max(last_over_time(kasboek_burndown_days_to_salary[1h]))'
                  instant: true
              - refId: F
                datasourceUid: "__expr__"
                model:
                  refId: F
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params:
                          - 0
            noDataState: OK
            execErrState: Error
            for: 0s
            labels:
              namespace: kasboek
            # D is how old the newest balance is: 0 after the morning pull. From 2 days on the pull
            # has stopped, and the figures say so. Compare with 0.0 and 1.0, not 0 and 1: the
            # values are floats, and Go's templates refuse to compare a float with an int.
            annotations:
              summary: 'Kasboek: € {{ printf "%.2f" $values.A.Value }} below the line to € 0 on payday'
              description: |-
                Balance € {{ printf "%.2f" $values.B.Value }}, line € {{ printf "%.2f" $values.C.Value }}{{ if gt $values.D.Value 1.0 }} (from {{ printf "%.0f" $values.D.Value }} days ago: has Kasboek's bank pull stopped?){{ end }}. {{ if gt $values.E.Value 0.0 }}Next salary in {{ printf "%.0f" $values.E.Value }} {{ if eq $values.E.Value 1.0 }}day{{ else }}days{{ end }}.{{ else }}The next salary is due.{{ end }}
                https://kasboek.lan.gemberkoekje.nl
