# Kasboek's 1Password item for monitoring, also in apps/kasboek (its README, "Monitoring"). Field
# used (exact label): KASBOEK_METRICS_TOKEN, which Prometheus sends to Kasboek's /metrics
# (prometheus-release.yaml, job kasboek). Mounted optionally: without the item Prometheus still
# starts, and only that job fails.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: kasboek-monitoring
  namespace: monitoring
spec:
  itemPath: "vaults/Gembercluster/items/kasboek-monitoring"
