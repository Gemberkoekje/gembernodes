# The community Loki chart (grafana-community/helm-charts). Since 2026-03-16 the chart in
# grafana/helm-charts is only maintained for Grafana Enterprise Logs; the open-source chart was
# forked at 6.55.0 and continues there, with a major version for every breaking change. Read the
# chart README's "Upgrading" section before moving to a new major (NOTES.md, 2026-11-12).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-loki
  namespace: monitoring
spec:
  interval: 5m
  install:
    remediation:
      retries: 3
  # No `force`: it was a one-off for the April 2026 volume change, and a forced upgrade replaces
  # whole objects instead of patching them.
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      version: "21.x"
      chart: loki
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: monitoring
      interval: 60m
  values:
    # "SingleBinary" until chart 12, which renamed it; the values stay under `singleBinary`.
    deploymentMode: Monolithic
    resultsCache:
      enabled: false
    chunksCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    # Grafana and Alloy talk to the single-binary Service on :3100 directly, so the
    # nginx gateway the chart puts in front of it is unused.
    gateway:
      enabled: false
    loki:
      auth_enabled: false
      # The chart aborts Loki when it can't join its memberlist cluster within ~5 minutes. With one
      # instance there is no cluster to join (the pod only finds itself, once it's Ready), so a
      # failed join must not stop it.
      extraMemberlistConfig:
        abort_if_cluster_join_fails: false
      commonConfig:
        replication_factor: 1
      storage:
        type: 'filesystem'
      schemaConfig:
        configs:
        - from: "2024-01-01"
          store: tsdb
          index:
            prefix: loki_index_
            period: 24h
          object_store: filesystem
          schema: v13
      # Keep 31 days of logs. Without retention enabled Loki never deletes anything and the
      # NFS share grows forever.
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        # Queries (and the 15-minute splits of longer ones) that end in the last 15 minutes run
        # unsharded. Sharded, each shard's result counts against max_query_series (500) before
        # any topk: the "Error logs detected" alert's quote query failed on that, and a failed
        # query mutes that alert (see grafana-alerting-provisioning.yaml).
        min_sharding_lookback: 15m
        allow_structured_metadata: true
        max_structured_metadata_size: 32MB
        retention_period: 744h
      ingester:
        chunk_encoding: zstd
    singleBinary:
      replicas: 1
      # The chart has no existingClaim option: it always creates its own claim from a
      # volumeClaimTemplate, so the storage class must be set here. Left empty it falls back
      # to the cluster default class (which was the removed longhorn class).
      persistence:
        enabled: true
        storageClass: qnap-nfs
        size: 10Gi
    read:
      replicas: 0
    backend:
      replicas: 0
    write:
      replicas: 0
