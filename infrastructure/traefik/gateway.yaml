# The public Gateway. Every public route is an HTTPRoute that attaches to it, served by Traefik
# (GatewayClass "traefik", created by the chart in traefik-release.yaml). How to add one: CLAUDE.md,
# "Public routes", with ingress/kluskat-route.yaml as the example.
#
# Listener ports are Traefik's entrypoint ports inside the pod (web 8000, websecure 8443); its
# Service on 192.168.1.231 maps 80 and 443 to them.
#
# - http: port 80 for every hostname. Each host has a route that redirects to HTTPS. cert-manager
#   attaches its temporary ACME HTTP-01 routes here (an exact path, so they win). The LAN-only routes
#   without a hostname (/grafana, /spacetraders/...) live here too, behind an IP allowlist.
# - https-gemberkoekje-nl: the bare domain, shared by the apps that also answer on a path of it
#   (/adventureengine, /dnd, /plotboek...). allowedRoutes lists their namespaces.
# - https-<app>: one per subdomain. allowedRoutes admits only the app's own namespace.
#
# The annotation below makes cert-manager issue the certificate each HTTPS listener names (a Secret in
# this namespace) through letsencrypt-gateway (configuration/certissuer-gateway.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
    - name: https-kluskat
      protocol: HTTPS
      port: 8443
      hostname: kluskat.gemberkoekje.nl
      tls:
        mode: Terminate
        certificateRefs:
          - name: kluskat-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: kluskat
    - name: https-gemberkoekje-nl
      protocol: HTTPS
      port: 8443
      hostname: gemberkoekje.nl
      tls:
        mode: Terminate
        certificateRefs:
          - name: gemberkoekje-nl-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - adventureengine
                  - cluster-healthcheck
                  - cov-website
                  - curatool
                  - dungeontable
                  - ebi-cs-api
                  - file-server
                  - hackerminigames
                  - plotboek-generator
                  - vortexplotboek
    - name: https-adventureengine
      protocol: HTTPS
      port: 8443
      hostname: adventureengine.gemberkoekje.nl
      tls:
        mode: Terminate
        certificateRefs:
          - name: adventureengine-tls
      allowedRoutes:
        namespaces:
          from: Selector
