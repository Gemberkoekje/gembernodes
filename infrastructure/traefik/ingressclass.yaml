# The IngressClass every Ingress in ingress/ names. Traefik's Ingress NGINX provider serves the
# Ingresses of this class (traefik-release.yaml: ingressClass nginx-public, controllerClass
# k8s.io/ingress-nginx). ingress-nginx's chart created it and marked it helm.sh/resource-policy:
# keep, so it stayed when ingress-nginx was uninstalled (docs/ingress-nginx-migration-plan.md,
# phase 4), and this file owns it. Helm's labels and annotations remain on the live object, unused.
# spec.controller can't change on a live IngressClass; it stays k8s.io/ingress-nginx.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx-public
spec:
  controller: k8s.io/ingress-nginx
