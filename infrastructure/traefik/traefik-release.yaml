# Traefik, the public entry point: the router forwards public 80/443 to its MetalLB IP,
# 192.168.1.231. It serves the Gateway API routes: the Gateway in gateway.yaml and the HTTPRoutes in
# ingress/ (CLAUDE.md, "Public routes"). It replaced the retired ingress-nginx
# (docs/ingress-nginx-migration-plan.md).
# Value keys checked against the chart's values.yaml for v41.6.0 (Gateway API: v41.7.1).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "42.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  # The chart ships its CRDs in crds/, which Helm only creates when missing. CreateReplace keeps
  # them current, and replaces the stale ones k3s's disabled bundled Traefik left behind.
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      checkNewVersion: false
    deployment:
      replicas: 2
      # Scraped by the existing Prometheus (kubernetes-pods job); 9100 is the metrics entrypoint.
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 512Mi
    service:
      annotations:
        metallb.io/loadBalancerIPs: 192.168.1.231
      spec:
        # Keep client IPs, so the lan-only allowlists (on /grafana and /spacetraders) see the real
        # client address.
        externalTrafficPolicy: Local
    # The chart would otherwise create a "traefik" IngressClass and make it the cluster default.
    ingressClass:
      enabled: false
    providers:
      # No Ingress objects: every route is an HTTPRoute.
      kubernetesIngress:
        enabled: false
      # Traefik's own CRDs: the HSTS Middleware (configuration/traefik-hsts.yaml) and the lan-only
      # Middlewares that HTTPRoutes reference through an ExtensionRef filter.
      kubernetesCRD:
        enabled: true
      # Gateway API: every public route (HTTPRoutes on gateway.yaml's Gateway). The chart installs
      # the Gateway API CRDs (standard channel) and the GatewayClass "traefik".
      kubernetesGateway:
        enabled: true
    # The public Gateway is gateway.yaml in this folder rather than the chart's default one, so
    # its listeners are plain Gateway API YAML next to the routes' rules (CLAUDE.md).
    gateway:
      enabled: false
    ports:
      websecure:
        transport:
          respondingTimeouts:
            # Traefik v3 limits reading a whole request to 60s by default, which would cut off
            # large fileserver uploads (up to 200m) on a slow connection.
            readTimeout: 600s
        http:
          middlewares:
            - traefik-hsts@kubernetescrd
    accessLog:
      enabled: true
