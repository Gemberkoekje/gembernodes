# Traefik, the public entry point: the router forwards public 80/443 to its MetalLB IP,
# 192.168.1.231. It serves the Ingress objects in ingress/ (class nginx-public, defined in
# ingressclass.yaml) through its Ingress NGINX provider, which understands their
# nginx.ingress.kubernetes.io annotations. It replaced the retired ingress-nginx, which phase 4 of
# docs/ingress-nginx-migration-plan.md removed.
# Value keys checked against the chart's values.yaml for v41.6.0 (publishService: v41.7.1).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "41.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  # The chart ships its CRDs in crds/, which Helm only creates when missing. CreateReplace keeps
  # them current, and replaces the stale ones k3s's disabled bundled Traefik left behind.
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      checkNewVersion: false
    deployment:
      replicas: 2
      # Scraped by the existing Prometheus (kubernetes-pods job); 9100 is the metrics entrypoint.
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 512Mi
    service:
      annotations:
        metallb.io/loadBalancerIPs: 192.168.1.231
      spec:
        # Keep client IPs, so the LAN-only allowlist on grafana-internal keeps working.
        externalTrafficPolicy: Local
    # The chart would otherwise create a "traefik" IngressClass and make it the cluster default.
    ingressClass:
      enabled: false
    providers:
      # The Ingress NGINX provider serves the Ingresses; the standard provider would build a
      # second, annotation-unaware set of routers for the same objects.
      kubernetesIngress:
        enabled: false
      # Needed for the HSTS Middleware (configuration/traefik-hsts.yaml).
      kubernetesCRD:
        enabled: true
      kubernetesIngressNGINX:
        enabled: true
        ingressClass: nginx-public
        controllerClass: k8s.io/ingress-nginx
        # The settings ingress-nginx ran with, so the Ingresses behave as they did there.
        strictValidatePathType: false
        allowSnippetAnnotations: false
        # Write Traefik's address (192.168.1.231, from the chart's own Service) into the status of
        # the Ingresses it serves. It stayed off while ingress-nginx also ran; both would have kept
        # overwriting the status.
        publishService:
          enabled: true
    ports:
      websecure:
        transport:
          respondingTimeouts:
            # Traefik v3 limits reading a whole request to 60s by default, which would cut off
            # large fileserver uploads (up to 200m) on a slow connection.
            readTimeout: 600s
        http:
          middlewares:
            - traefik-hsts@kubernetescrd
    accessLog:
      enabled: true
