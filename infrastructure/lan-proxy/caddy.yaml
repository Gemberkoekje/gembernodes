# The LAN-only name switchboard: <app>.lan.gemberkoekje.nl -> the app's Service. See the Caddyfile
# for the names and NOTES.md (2026-11-06) for the DNS records. 192.168.1.236 is not forwarded by the
# router; Tailscale's subnet router covers it. Two replicas so a kured reboot doesn't take the
# names away.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: lan-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: caddy
      containers:
        - name: caddy
          image: caddy:2.11.9-alpine
          imagePullPolicy: IfNotPresent
          command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # Caddy's own data/config dirs; nothing here needs to survive a restart.
            - name: XDG_DATA_HOME
              value: /data
            - name: XDG_CONFIG_HOME
              value: /config
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: config
              mountPath: /srv/index.html
              subPath: index.html
            - name: data
              mountPath: /data
            - name: xdg-config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      volumes:
        # Generated by kustomize with a content hash, so a change to the Caddyfile or the start
        # page rolls the pods.
        - name: config
          configMap:
            name: caddy-config
        - name: data
          emptyDir: {}
        - name: xdg-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: lan-proxy
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.236
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: caddy
  ports:
    - name: http
      port: 80
      targetPort: http
    # Only so browsers that try https first get an answer (see the Caddyfile); it redirects to http.
    - name: https
      port: 443
      targetPort: https
