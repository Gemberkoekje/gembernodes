# One certificate for the start page and every <app>.lan name. Issued by letsencrypt-lan
# (configuration/certissuer-lan.yaml, DNS-01 via acme-dns); cert-manager renews it 30 days before
# it expires. Caddy serves it from the lan-wildcard-tls secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lan-wildcard
  namespace: lan-proxy
spec:
  secretName: lan-wildcard-tls
  dnsNames:
    - lan.gemberkoekje.nl
    - "*.lan.gemberkoekje.nl"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-lan
  privateKey:
    rotationPolicy: Always
